
<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Save the Date</title>

  <!-- ============================================================
       SEO / SOCIAL
       ============================================================ -->

  <meta
    name="description"
    id="metaDescription"
    content="אתם מוזמנים לחגוג איתנו את היום המיוחד שלנו"
  >

  <link
    rel="canonical"
    id="canonicalLink"
    href=""
  >

  <meta property="og:type" content="website">

  <meta
    property="og:locale"
    id="ogLocale"
    content="he_IL"
  >

  <meta
    property="og:title"
    id="ogTitle"
    content="הזמנה לחתונה"
  >

  <meta
    property="og:description"
    id="ogDescription"
    content="אתם מוזמנים לחגוג איתנו את היום המיוחד שלנו"
  >

  <meta
    property="og:image"
    id="ogImage"
    content=""
  >

  <meta
    property="og:image:alt"
    id="ogImageAlt"
    content=""
  >

  <meta
    property="og:url"
    id="ogUrl"
    content=""
  >

  <meta
    property="og:site_name"
    content="dotpage"
  >

  <meta
    name="twitter:card"
    content="summary_large_image"
  >

  <meta
    name="twitter:title"
    id="twitterTitle"
    content="שמרו את התאריך"
  >

  <meta
    name="twitter:description"
    id="twitterDescription"
    content="הזמנה לחתונה"
  >

  <meta
    name="twitter:image"
    id="twitterImage"
    content=""
  >

  <meta
    name="twitter:image:alt"
    id="twitterImageAlt"
    content=""
  >


  <!-- ============================================================
       FONTS
       ============================================================ -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;600;700&family=Assistant:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@500;600;700&display=swap"
    rel="stylesheet"
  >


  <style>

    /* ============================================================
       DESIGN TOKENS
       ============================================================ */

    :root {

      --cream: #FAF6F0;
      --forest: #2C3E35;
      --forest-soft: #3E5347;

      --gold: #D4AF37;
      --gold-soft: #E7CD79;

      --paper: #FFFDFB;

      --line: rgba(44,62,53,0.14);

      --font-display:
        'Frank Ruhl Libre',
        'David Libre',
        serif;

      --font-script:
        'Playfair Display',
        var(--font-display);

      --font-body:
        'Assistant',
        'Segoe UI',
        sans-serif;

      --shadow-soft:
        0 18px 50px -18px rgba(0,0,0,0.45);

      --shadow-tight:
        0 8px 24px -10px rgba(0,0,0,0.35);

    }


    /* ============================================================
       RESET
       ============================================================ */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html {
      scroll-behavior: smooth;
    }


    body {

      min-height: 100vh;

      background: var(--forest);

      color: var(--forest);

      font-family: var(--font-body);

      -webkit-font-smoothing: antialiased;

      overflow-x: hidden;

    }


    img,
    video {

      display: block;

      max-width: 100%;

    }


    button,
    input,
    textarea,
    select {

      font: inherit;

    }


    button {

      cursor: pointer;

    }


    a:focus-visible,
    button:focus-visible {

      outline: 2px solid var(--gold);

      outline-offset: 3px;

    }


    /* ============================================================
       HERO
       ============================================================ */

    .hero {

      position: relative;

      width: 100%;

      min-height: 100vh;

      min-height: 100dvh;

      display: flex;

      align-items: center;

      justify-content: center;

      overflow: hidden;

      background: #111;

    }


    /* ============================================================
       HORIZONTAL VIDEO
       ============================================================ */

    .hero-video-wrap {

      position: absolute;

      inset: 0;

      z-index: 0;

      display: flex;

      align-items: center;

      justify-content: center;

      background: #111;

      overflow: hidden;

    }


    .hero-video {

      width: 100%;

      height: 100%;

      object-fit: cover;

      object-position: center center;

    }


    /*
      Desktop:
      preserve the horizontal video as much as possible.
    */

    @media (min-width: 768px) {

      .hero-video {

        object-fit: cover;

      }

    }


    /*
      Mobile:
      A horizontal 16:9 video naturally gets cropped on a tall
      phone screen. This keeps the video filling the screen
      without distortion.
    */

    @media (max-width: 767px) {

      .hero-video {

        object-fit: cover;

        object-position: center center;

      }

    }


    /* ============================================================
       VIDEO OVERLAY
       ============================================================ */

    .hero-overlay {

      position: absolute;

      inset: 0;

      z-index: 1;

      pointer-events: none;

      background:

        linear-gradient(
          180deg,
          rgba(12,16,13,0.28) 0%,
          rgba(12,16,13,0.08) 25%,
          rgba(12,16,13,0.25) 52%,
          rgba(12,16,13,0.72) 100%
        );

    }


    /* ============================================================
       HERO CONTENT
       ============================================================ */

    .hero-content {

      position: relative;

      z-index: 2;

      width: 100%;

      max-width: 760px;

      padding:

        clamp(24px, 5vh, 50px)

        22px

        clamp(70px, 9vh, 100px);

      color: #18251f;

      text-align: center;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      min-height: 100vh;

      min-height: 100dvh;

    }


    .hero-content > * {

      opacity: 0;

      transform: translateY(18px);

      animation:
        hero-rise
        0.8s
        ease
        forwards;

    }


    @keyframes hero-rise {

      to {

        opacity: 1;

        transform: translateY(0);

      }

    }


    .save-the-date {

      animation-delay: 0.05s;

      font-family: var(--font-body);

      font-size:
        clamp(
          0.9rem,
          2vw,
          1.15rem
        );

      font-weight: 600;

      letter-spacing: 0.22em;

      text-transform: uppercase;

      color: #18251f;

      text-shadow:
        0 2px 18px rgba(0,0,0,0.45);

      margin-bottom:
        clamp(
          10px,
          2vh,
          18px
        );

    }


    /* ============================================================
       NAMES
       ============================================================ */

    .hero-names {

      animation-delay: 0.2s;

      font-family: var(--font-script);

      font-weight: 600;

      font-size:
        clamp(
          3rem,
          9vw,
          6.5rem
        );

      line-height: 0.95;

      letter-spacing: -0.025em;

      color: #18251f;

      text-shadow:
        0 5px 35px rgba(0,0,0,0.48);

      margin-bottom:
        clamp(
          20px,
          4vh,
          34px
        );

    }


    .hero-names .amp {

      color: var(--gold-soft);

      font-style: italic;

      padding: 0 10px;

    }


    /* ============================================================
       COUNTDOWN
       ============================================================ */

    .countdown {

      animation-delay: 0.35s;

      display: flex;

      align-items: center;

      justify-content: center;

      gap:
        clamp(
          10px,
          2.5vw,
          24px
        );

      margin-bottom:
        clamp(
          18px,
          3.5vh,
          30px
        );

    }


    .countdown-item {

      display: flex;

      flex-direction: column;

      align-items: center;

      min-width: 45px;

    }


    .countdown-number {

      font-family: var(--font-display);

      font-size:
        clamp(
          1.9rem,
          4vw,
          2.8rem
        );

      font-weight: 600;

      line-height: 1;

      color: #18251f;

      font-variant-numeric: tabular-nums;

      text-shadow:
        0 2px 16px rgba(0,0,0,0.4);

    }


    .countdown-label {

      margin-top: 5px;

      font-size:
        clamp(
          0.72rem,
          1.8vw,
          0.9rem
        );

      color:
        rgba(241, 241, 241, 0.78);

    }


    .countdown-divider {

      width: 1px;

      height: 32px;

      background:
        rgba(255,255,255,0.45);

    }


    /* ============================================================
       EVENT INFORMATION
       ============================================================ */

    .hero-meta {

      animation-delay: 0.5s;

      display: flex;

      flex-direction: column;

      align-items: center;

      gap: 8px;

      margin-bottom:
        clamp(
          20px,
          4vh,
          32px
        );

    }


    .meta-label {

      font-size:
        clamp(
          0.8rem,
          2vw,
          0.95rem
        );

      font-weight: 600;

      letter-spacing: 0.14em;

      text-transform: uppercase;

      color:
        #18251f;

    }


    .meta-value {

      font-size:
        clamp(
          1rem,
          2.5vw,
          1.2rem
        );

      font-weight: 600;

      color: #18251f;

      text-shadow:
        0 2px 12px rgba(0,0,0,0.35);

    }


    /* ============================================================
       CTA
       ============================================================ */

    .hero-button {

      animation-delay: 0.65s;

      display: inline-flex;

      align-items: center;

      justify-content: center;

      min-height: 48px;

      padding: 13px 30px;

      border: 0;

      border-radius: 999px;

      background: #fff;

      color: var(--forest);

      font-weight: 700;

      font-size:
        clamp(
          0.9rem,
          2.2vw,
          1rem
        );

      box-shadow:
        0 12px 30px -10px
        rgba(0,0,0,0.5);

      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease;

    }


    .hero-button:hover {

      transform: translateY(-2px);

      box-shadow:
        0 16px 34px -10px
        rgba(0,0,0,0.55);

    }


    .hero-button:active {

      transform: scale(0.97);

    }


    /* ============================================================
       CREDIT
       ============================================================ */

    .hero-credit {

      animation-delay: 0.8s;

      margin-top:
        clamp(
          14px,
          3vh,
          24px
        );

      font-size: 0.72rem;

      color:
        rgba(255,255,255,0.55);

    }


    /* ============================================================
       LANGUAGE BUTTON
       ============================================================ */

    .lang-toggle {

      position: fixed;

      z-index: 50;

      bottom:
        max(
          18px,
          env(safe-area-inset-bottom)
        );

      inset-inline-end: 18px;

      display: inline-flex;

      align-items: center;

      gap: 6px;

      padding: 8px 14px;

      border:
        1px solid
        rgba(255,255,255,0.85);

      border-radius: 999px;

      background:
        rgba(255,255,255,0.9);

      color: var(--forest);

      font-size: 0.78rem;

      font-weight: 600;

      box-shadow: var(--shadow-tight);

      backdrop-filter: blur(8px);

      -webkit-backdrop-filter: blur(8px);

    }


    .lang-toggle svg {

      width: 14px;

      height: 14px;

      flex-shrink: 0;

    }


    /* ============================================================
       MODAL
       ============================================================ */

    .modal-overlay {

      position: fixed;

      inset: 0;

      z-index: 100;

      display: flex;

      align-items: flex-end;

      justify-content: center;

      padding: 0;

      background:
        rgba(20,25,21,0.62);

      backdrop-filter: blur(5px);

      -webkit-backdrop-filter: blur(5px);

      opacity: 0;

      pointer-events: none;

      transition:
        opacity 0.3s ease;

    }


    .modal-overlay.is-open {

      opacity: 1;

      pointer-events: auto;

    }


    .modal-sheet {

      width: 100%;

      max-width: 560px;

      max-height: 90vh;

      max-height: 90dvh;

      display: flex;

      flex-direction: column;

      background: var(--cream);

      color: var(--forest);

      border-radius:
        26px
        26px
        0
        0;

      box-shadow:
        0 -20px 60px -20px
        rgba(0,0,0,0.5);

      transform:
        translateY(100%);

      transition:
        transform
        0.4s
        cubic-bezier(.32,.72,.35,1);

      padding-bottom:
        env(
          safe-area-inset-bottom,
          0px
        );

    }


    .modal-overlay.is-open .modal-sheet {

      transform:
        translateY(0);

    }


    @media (min-width: 900px) {

      .modal-overlay {

        align-items: center;

        padding: 24px;

      }


      .modal-sheet {

        border-radius: 26px;

        max-height: 82vh;

        max-height: 82dvh;

      }

    }


    .modal-header {

      flex-shrink: 0;

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 17px 20px;

      border-bottom:
        1px solid var(--line);

    }


    .modal-title {

      font-family: var(--font-display);

      font-size: 1.3rem;

      font-weight: 600;

    }


    .modal-close {

      width: 36px;

      height: 36px;

      flex-shrink: 0;

      display: flex;

      align-items: center;

      justify-content: center;

      border:
        1px solid var(--line);

      border-radius: 50%;

      background: var(--paper);

      color: var(--forest);

      font-size: 1rem;

    }


    .modal-body {

      flex: 1;

      min-height: 0;

      overflow-y: auto;

      padding: 20px;

    }


    .form-loader {

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      gap: 12px;

      padding: 35px 0;

      color: var(--forest-soft);

    }


    .spinner {

      width: 28px;

      height: 28px;

      border-radius: 50%;

      border:
        3px solid
        rgba(212,175,55,0.25);

      border-top-color:
        var(--gold);

      animation:
        spin
        0.9s
        linear
        infinite;

    }


    @keyframes spin {

      to {

        transform:
          rotate(360deg);

      }

    }


    #rsvpIframe {

      display: block;

      width: 100%;

      min-height: 560px;

      border: 0;

      border-radius: 16px;

      background: transparent;

    }


    /* ============================================================
       MOBILE ADJUSTMENTS
       ============================================================ */

    @media (max-width: 767px) {

      .hero-content {

        max-width: 520px;

        padding-left: 18px;

        padding-right: 18px;

        padding-top: 35px;

        padding-bottom: 85px;

      }


      .hero-names {

        font-size:
          clamp(
            2.7rem,
            14vw,
            4.4rem
          );

      }


      .countdown {

        gap: 9px;

      }


      .countdown-item {

        min-width: 38px;

      }


      .countdown-number {

        font-size:
          clamp(
            1.65rem,
            7vw,
            2.2rem
          );

      }


      .countdown-divider {

        height: 27px;

      }


      .hero-meta {

        margin-bottom: 20px;

      }


      .hero-button {

        padding:
          12px 25px;

      }

    }


    /* ============================================================
       VERY SMALL PHONES
       ============================================================ */

    @media (max-width: 380px) {

      .hero-content {

        padding-left: 14px;

        padding-right: 14px;

      }


      .hero-names {

        font-size: 2.55rem;

      }


      .countdown {

        gap: 6px;

      }


      .countdown-item {

        min-width: 34px;

      }


      .countdown-number {

        font-size: 1.55rem;

      }


      .countdown-label {

        font-size: 0.66rem;

      }

    }


    /* ============================================================
       REDUCED MOTION
       ============================================================ */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {

        animation-duration: 0.01ms !important;

        animation-iteration-count: 1 !important;

        transition-duration: 0.01ms !important;

        scroll-behavior: auto !important;

      }

    }

  </style>

</head>


<body>


  <!-- ============================================================
       HERO
       ============================================================ -->

  <main class="hero">


    <!-- ==========================================================
         HORIZONTAL VIDEO
         ========================================================== -->

    <div class="hero-video-wrap">

      <video
        id="heroVideo"
        class="hero-video"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
      ></video>

    </div>


    <div
      class="hero-overlay"
      aria-hidden="true"
    ></div>


    <!-- ==========================================================
         CONTENT
         ========================================================== -->

    <div class="hero-content">


      <p
        class="save-the-date"
        data-en="Save the Date"
      >
        שמרו את התאריך
      </p>


      <h1 class="hero-names">

        <span id="brideName"></span>

        <span class="amp">&amp;</span>

        <span id="groomName"></span>

      </h1>


      <!-- ========================================================
           COUNTDOWN
           ======================================================== -->

      <div
        class="countdown"
        id="countdown"
      >

        <div class="countdown-item">

          <span
            class="countdown-number"
            id="cd-days"
          >
            00
          </span>

          <span
            class="countdown-label"
            data-en="days"
          >
            ימים
          </span>

        </div>


        <span
          class="countdown-divider"
          aria-hidden="true"
        ></span>


        <div class="countdown-item">

          <span
            class="countdown-number"
            id="cd-hours"
          >
            00
          </span>

          <span
            class="countdown-label"
            data-en="hours"
          >
            שעות
          </span>

        </div>


        <span
          class="countdown-divider"
          aria-hidden="true"
        ></span>


        <div class="countdown-item">

          <span
            class="countdown-number"
            id="cd-minutes"
          >
            00
          </span>

          <span
            class="countdown-label"
            data-en="minutes"
          >
            דקות
          </span>

        </div>


        <span
          class="countdown-divider"
          aria-hidden="true"
        ></span>


        <div class="countdown-item">

          <span
            class="countdown-number"
            id="cd-seconds"
          >
            00
          </span>

          <span
            class="countdown-label"
            data-en="seconds"
          >
            שניות
          </span>

        </div>

      </div>


      <!-- ========================================================
           EVENT DETAILS
           ======================================================== -->

      <div class="hero-meta">


        <div>

          <p
            class="meta-label"
            data-en="Where"
          >
            איפה
          </p>

          <p
            class="meta-value"
            id="venue"
          ></p>

        </div>


        <div>

          <p
            class="meta-label"
            data-en="When"
          >
            מתי
          </p>

          <p
            class="meta-value"
            id="eventDate"
          ></p>

        </div>


      </div>


      <!-- ========================================================
           RSVP BUTTON
           ======================================================== -->

      <button
        class="hero-button"
        id="openRsvp"
        type="button"
      >

        <span data-en="Learn More / RSVP">
          לאישור הגעה
        </span>

      </button>


      <p
        class="hero-credit"
        data-en="Made with love by dotpage 🤍"
      >
        נבנה באהבה על ידי dotpage 🤍
      </p>


    </div>


  </main>


  <!-- ============================================================
       LANGUAGE TOGGLE
       ============================================================ -->

  <button
    class="lang-toggle"
    id="langToggle"
    type="button"
    aria-label="Switch language"
  >

    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.6"
      aria-hidden="true"
    >

      <circle
        cx="12"
        cy="12"
        r="9"
      />

      <path
        d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.7-3.8-9S9.5 5.6 12 3Z"
      />

    </svg>


    <span
      id="langToggleLabel"
      data-en-label="עברית"
      data-he-label="English"
    >
      English
    </span>

  </button>


  <!-- ============================================================
       RSVP MODAL
       ============================================================ -->

  <div
    class="modal-overlay"
    id="rsvpModal"
    aria-hidden="true"
  >

    <div
      class="modal-sheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
    >


      <div class="modal-header">

        <h2
          class="modal-title"
          id="modalTitle"
        >
          מיכל &amp; אסף
        </h2>


        <button
          class="modal-close"
          id="closeRsvp"
          type="button"
          aria-label="סגירה"
        >
          ✕
        </button>

      </div>


      <div class="modal-body">


        <div
          class="form-loader"
          id="formLoader"
        >

          <div
            class="spinner"
            aria-hidden="true"
          ></div>

          <span data-en="Loading form...">
            טוען את הטופס...
          </span>

        </div>


        <iframe
          id="rsvpIframe"
          src=""
          title="טופס אישור הגעה"
        ></iframe>


      </div>

    </div>

  </div>


  <!-- ============================================================
       DYNAMIC INVITATION SCRIPT
       ============================================================ -->

  <script>

    (function () {

      "use strict";


      /* ==========================================================
         GLOBAL STATE
         ========================================================== */

      var invitationData = null;

      var currentLang = "he";

      var countdownTimer = null;

      var weddingDate = null;


      /* ==========================================================
         ELEMENTS
         ========================================================== */

      var els = {

        brideName:
          document.getElementById("brideName"),

        groomName:
          document.getElementById("groomName"),

        venue:
          document.getElementById("venue"),

        eventDate:
          document.getElementById("eventDate"),

        heroVideo:
          document.getElementById("heroVideo"),

        days:
          document.getElementById("cd-days"),

        hours:
          document.getElementById("cd-hours"),

        minutes:
          document.getElementById("cd-minutes"),

        seconds:
          document.getElementById("cd-seconds"),

        modal:
          document.getElementById("rsvpModal"),

        modalTitle:
          document.getElementById("modalTitle"),

        openRsvp:
          document.getElementById("openRsvp"),

        closeRsvp:
          document.getElementById("closeRsvp"),

        rsvpIframe:
          document.getElementById("rsvpIframe"),

        formLoader:
          document.getElementById("formLoader"),

        langToggle:
          document.getElementById("langToggle"),

        langToggleLabel:
          document.getElementById("langToggleLabel")

      };


      /* ==========================================================
         META ELEMENTS
         ========================================================== */

      var metaEls = {

        description:
          document.getElementById("metaDescription"),

        canonical:
          document.getElementById("canonicalLink"),

        ogLocale:
          document.getElementById("ogLocale"),

        ogTitle:
          document.getElementById("ogTitle"),

        ogDescription:
          document.getElementById("ogDescription"),

        ogImage:
          document.getElementById("ogImage"),

        ogImageAlt:
          document.getElementById("ogImageAlt"),

        ogUrl:
          document.getElementById("ogUrl"),

        twitterTitle:
          document.getElementById("twitterTitle"),

        twitterDescription:
          document.getElementById("twitterDescription"),

        twitterImage:
          document.getElementById("twitterImage"),

        twitterImageAlt:
          document.getElementById("twitterImageAlt")

      };


      /* ==========================================================
         GET SLUG
         ========================================================== */

      function getInvitationSlug() {

        /*
          Supports:

          /d5/michal-assaf/

          and local testing:

          /d5/?slug=michal-assaf
        */

        var params =
          new URLSearchParams(
            window.location.search
          );

        var querySlug =
          params.get("slug");


        if (querySlug) {

          return querySlug
            .trim()
            .toLowerCase();

        }


        var pathParts =
          window.location.pathname
            .split("/")
            .filter(Boolean);


        /*
          /d5/michal-assaf/

          => ["d5", "michal-assaf"]
        */

        if (pathParts.length >= 2) {

          return pathParts[
            pathParts.length - 1
          ]
            .trim()
            .toLowerCase();

        }


        return null;

      }


      /* ==========================================================
         LOAD JSON
         ========================================================== */

      function loadInvitationData() {

        var slug =
          getInvitationSlug();


        if (!slug) {

          console.error(
            "No invitation slug found in URL."
          );

          return;

        }


        /*
          IMPORTANT:

          Absolute root path.

          Correct:
          /data/michal-assaf.json

          NOT:
          ./data/michal-assaf.json
        */

        var jsonUrl =
          "/data/" +
          encodeURIComponent(slug) +
          ".json";


        fetch(jsonUrl, {
          cache: "no-store"
        })

          .then(function (response) {

            if (!response.ok) {

              throw new Error(
                "Could not load invitation JSON. HTTP " +
                response.status +
                " — " +
                jsonUrl
              );

            }

            return response.json();

          })

          .then(function (data) {

            invitationData = data;

            initializeInvitation();

          })

          .catch(function (error) {

            console.error(
              "Invitation loading error:",
              error
            );

          });

      }


      /* ==========================================================
         HELPERS
         ========================================================== */

      function getLocalizedValue(
        heKey,
        enKey
      ) {

        if (!invitationData) {

          return "";

        }


        if (currentLang === "en") {

          return invitationData[enKey] || "";

        }


        return invitationData[heKey] || "";

      }


      function getNames() {

        if (!invitationData) {

          return {
            bride: "",
            groom: ""
          };

        }


        return {

          bride:
            currentLang === "en"
              ? invitationData.brideNameEn || ""
              : invitationData.brideNameHe || "",

          groom:
            currentLang === "en"
              ? invitationData.groomNameEn || ""
              : invitationData.groomNameHe || ""

        };

      }


      /* ==========================================================
         INITIALIZE
         ========================================================== */

      function initializeInvitation() {

        if (!invitationData) {

          return;

        }


        /*
          Standard schema:

          brideNameEn
          brideNameHe
          groomNameEn
          groomNameHe
          date
          dateISO
          venueEn
          venueHe
          rsvpUrlEn
          rsvpUrlHe
          heroVideo
          audio
        */


        weddingDate =
          invitationData.dateISO
            ? new Date(
                invitationData.dateISO
              )
            : null;


        updateContent();


        setupVideo();


        setupAudio();


        setupRsvp();


        updateSeoMeta();


        startCountdown();


        setupEvents();

      }


      /* ==========================================================
         UPDATE CONTENT
         ========================================================== */

      function updateContent() {

        var names =
          getNames();


        /*
          Names
        */

        if (els.brideName) {

          els.brideName.textContent =
            names.bride;

        }


        if (els.groomName) {

          els.groomName.textContent =
            names.groom;

        }


        /*
          Venue
        */

        if (els.venue) {

          els.venue.textContent =
            getLocalizedValue(
              "venueHe",
              "venueEn"
            );

        }


        /*
          Date

          The `date` field is intentionally
          shared between Hebrew and English
          because your current JSON uses the
          same formatted date.
        */

        if (els.eventDate) {

          els.eventDate.textContent =
            invitationData.date || "";

        }


        /*
          Modal title
        */

        if (els.modalTitle) {

          els.modalTitle.textContent =
            names.bride +
            " & " +
            names.groom;

        }


        /*
          Direction
        */

        document.documentElement
          .setAttribute(
            "lang",
            currentLang
          );

        document.documentElement
          .setAttribute(
            "dir",
            currentLang === "he"
              ? "rtl"
              : "ltr"
          );


        /*
          Static translated elements
        */

        var translatable =
          document.querySelectorAll(
            "[data-en]"
          );


        translatable.forEach(
          function (element) {

            /*
              Save the original Hebrew
              text only once.
            */

            if (
              !element.hasAttribute(
                "data-he"
              )
            ) {

              element.setAttribute(
                "data-he",
                element.textContent.trim()
              );

            }


            if (
              currentLang === "en"
            ) {

              element.textContent =
                element.getAttribute(
                  "data-en"
                );

            } else {

              element.textContent =
                element.getAttribute(
                  "data-he"
                );

            }

          }
        );


        /*
          Language button
        */

        if (els.langToggleLabel) {

          els.langToggleLabel.textContent =
            currentLang === "he"
              ? els.langToggleLabel
                  .getAttribute(
                    "data-he-label"
                  )
              : els.langToggleLabel
                  .getAttribute(
                    "data-en-label"
                  );

        }


        /*
          RSVP iframe title
        */

        if (els.rsvpIframe) {

          els.rsvpIframe.title =
            currentLang === "he"
              ? "טופס אישור הגעה"
              : "RSVP Form";

        }

      }


      /* ==========================================================
         VIDEO
         ========================================================== */

      function setupVideo() {

        if (!els.heroVideo) {

          return;

        }


        var videoUrl =
          invitationData.heroVideo || "";


        if (!videoUrl) {

          console.warn(
            "No heroVideo found in invitation JSON."
          );

          return;

        }


        /*
          Absolute root path from JSON:

          /assets/flowerhorizontalvideo.mp4
        */

        els.heroVideo.src =
          videoUrl;


        els.heroVideo.load();


        /*
          Attempt autoplay.

          Because the video is muted,
          browsers normally allow this.
        */

        var playPromise =
          els.heroVideo.play();


        if (
          playPromise &&
          typeof playPromise.catch === "function"
        ) {

          playPromise.catch(
            function (error) {

              console.log(
                "Video autoplay waiting for browser permission:",
                error
              );

            }
          );

        }

      }


      /* ==========================================================
         AUDIO
         ========================================================== */

      function setupAudio() {

        /*
          d5 currently does not display
          an audio control.

          The JSON audio field is still
          accepted so all invitation
          templates can share the same schema.

          If you later add an audio button,
          use invitationData.audio.
        */

        if (invitationData.audio) {

          console.log(
            "Invitation audio:",
            invitationData.audio
          );

        }

      }


      /* ==========================================================
         RSVP
         ========================================================== */

      function setupRsvp() {

        if (!els.rsvpIframe) {

          return;

        }


        var rsvpUrl =
          currentLang === "en"
            ? invitationData.rsvpUrlEn
            : invitationData.rsvpUrlHe;


        if (rsvpUrl) {

          els.rsvpIframe.src =
            rsvpUrl;

        } else {

          els.rsvpIframe.removeAttribute(
            "src"
          );

        }

      }


      /* ==========================================================
         COUNTDOWN
         ========================================================== */

      function startCountdown() {

        if (!weddingDate) {

          return;

        }


        if (
          isNaN(
            weddingDate.getTime()
          )
        ) {

          console.error(
            "Invalid dateISO:",
            invitationData.dateISO
          );

          return;

        }


        if (countdownTimer) {

          clearInterval(
            countdownTimer
          );

        }


        function updateCountdown() {

          var now =
            new Date().getTime();


          var target =
            weddingDate.getTime();


          var distance =
            target - now;


          if (distance <= 0) {

            setCountdownValues(
              0,
              0,
              0,
              0
            );

            clearInterval(
              countdownTimer
            );

            return;

          }


          var days =
            Math.floor(
              distance /
              (1000 * 60 * 60 * 24)
            );


          var hours =
            Math.floor(
              (
                distance %
                (1000 * 60 * 60 * 24)
              ) /
              (1000 * 60 * 60)
            );


          var minutes =
            Math.floor(
              (
                distance %
                (1000 * 60 * 60)
              ) /
              (1000 * 60)
            );


          var seconds =
            Math.floor(
              (
                distance %
                (1000 * 60)
              ) /
              1000
            );


          setCountdownValues(
            days,
            hours,
            minutes,
            seconds
          );

        }


        updateCountdown();


        countdownTimer =
          setInterval(
            updateCountdown,
            1000
          );

      }


      function setCountdownValues(
        days,
        hours,
        minutes,
        seconds
      ) {

        if (els.days) {

          els.days.textContent =
            String(days)
              .padStart(2, "0");

        }


        if (els.hours) {

          els.hours.textContent =
            String(hours)
              .padStart(2, "0");

        }


        if (els.minutes) {

          els.minutes.textContent =
            String(minutes)
              .padStart(2, "0");

        }


        if (els.seconds) {

          els.seconds.textContent =
            String(seconds)
              .padStart(2, "0");

        }

      }


      /* ==========================================================
         RSVP MODAL
         ========================================================== */

      function openModal() {

        if (!els.modal) {

          return;

        }


        /*
          Refresh RSVP URL according
          to current language.
        */

        setupRsvp();


        els.modal.classList.add(
          "is-open"
        );


        els.modal.setAttribute(
          "aria-hidden",
          "false"
        );


        document.body.style.overflow =
          "hidden";

      }


      function closeModal() {

        if (!els.modal) {

          return;

        }


        els.modal.classList.remove(
          "is-open"
        );


        els.modal.setAttribute(
          "aria-hidden",
          "true"
        );


        document.body.style.overflow =
          "";

      }


      /* ==========================================================
         EVENTS
         ========================================================== */

      function setupEvents() {

        /*
          RSVP open
        */

        if (els.openRsvp) {

          els.openRsvp.addEventListener(
            "click",
            openModal
          );

        }


        /*
          RSVP close
        */

        if (els.closeRsvp) {

          els.closeRsvp.addEventListener(
            "click",
            closeModal
          );

        }


        /*
          Click outside modal
        */

        if (els.modal) {

          els.modal.addEventListener(
            "click",
            function (event) {

              if (
                event.target ===
                els.modal
              ) {

                closeModal();

              }

            }
          );

        }


        /*
          ESC closes modal
        */

        document.addEventListener(
          "keydown",
          function (event) {

            if (
              event.key === "Escape"
            ) {

              closeModal();

            }

          }
        );


        /*
          Language
        */

        if (els.langToggle) {

          els.langToggle.addEventListener(
            "click",
            toggleLanguage
          );

        }


        /*
          RSVP iframe loaded
        */

        if (els.rsvpIframe) {

          els.rsvpIframe.addEventListener(
            "load",
            function () {

              if (els.formLoader) {

                els.formLoader.style.display =
                  "none";

              }

            }
          );

        }

      }


      /* ==========================================================
         LANGUAGE
         ========================================================== */

      function toggleLanguage() {

        currentLang =
          currentLang === "he"
            ? "en"
            : "he";


        updateContent();


        setupRsvp();


        /*
          Update video if you ever decide
          to provide language-specific
          videos.

          Currently heroVideo is shared.
        */

      }


      /* ==========================================================
         SEO
         ========================================================== */

      function updateSeoMeta() {

        if (!invitationData) {

          return;

        }


        var names =
          getNames();


        var venue =
          getLocalizedValue(
            "venueHe",
            "venueEn"
          );


        var date =
          invitationData.date || "";


        var titleText =
          names.bride +
          " & " +
          names.groom +
          " - " +
          (
            currentLang === "he"
              ? "שמרו את התאריך"
              : "Save the Date"
          );


        var descriptionText =
          currentLang === "he"

            ? "הנכם מוזמנים לחתונה של " +
              names.bride +
              " ו" +
              names.groom +
              " ב-" +
              date +
              " ב" +
              venue

            : "You are invited to the wedding of " +
              names.bride +
              " and " +
              names.groom +
              " on " +
              date +
              " at " +
              venue;


        document.title =
          titleText;


        if (metaEls.description) {

          metaEls.description
            .setAttribute(
              "content",
              descriptionText
            );

        }


        if (metaEls.canonical) {

          metaEls.canonical
            .setAttribute(
              "href",
              window.location.href
            );

        }


        if (metaEls.ogLocale) {

          metaEls.ogLocale
            .setAttribute(
              "content",
              currentLang === "he"
                ? "he_IL"
                : "en_US"
            );

        }


        if (metaEls.ogTitle) {

          metaEls.ogTitle
            .setAttribute(
              "content",
              titleText
            );

        }


        if (metaEls.ogDescription) {

          metaEls.ogDescription
            .setAttribute(
              "content",
              descriptionText
            );

        }


        if (metaEls.ogUrl) {

          metaEls.ogUrl
            .setAttribute(
              "content",
              window.location.href
            );

        }


        if (metaEls.twitterTitle) {

          metaEls.twitterTitle
            .setAttribute(
              "content",
              titleText
            );

        }


        if (metaEls.twitterDescription) {

          metaEls.twitterDescription
            .setAttribute(
              "content",
              descriptionText
            );

        }


        /*
          We don't invent an image URL.

          If later your JSON gets an
          ogImage field, it can be added here.
        */

      }


      /* ==========================================================
         DOM READY
         ========================================================== */

      if (
        document.readyState ===
        "loading"
      ) {

        document.addEventListener(
          "DOMContentLoaded",
          loadInvitationData
        );

      } else {

        loadInvitationData();

      }

    })();

  </script>

</body>

</html>
