<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Save the Date</title>

  <!-- ============================================================
       SOCIAL / SEO METADATA
       These values are updated dynamically from the customer JSON.
       Hebrew is the default language.
       ============================================================ -->

  <meta
    name="description"
    id="metaDescription"
    content="הזמנה לחתונה"
  >

  <link
    rel="canonical"
    id="canonicalLink"
    href=""
  >

  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:locale"
    id="ogLocale"
    content="he_IL"
  >

  <meta
    property="og:title"
    id="ogTitle"
    content="שמרו את התאריך"
  >

  <meta
    property="og:description"
    id="ogDescription"
    content="הזמנה לחתונה"
  >

  <meta
    property="og:image"
    id="ogImage"
    content=""
  >

  <meta
    property="og:image:alt"
    id="ogImageAlt"
    content=""
  >

  <meta
    property="og:url"
    id="ogUrl"
    content=""
  >

  <meta
    property="og:site_name"
    content="dotpage"
  >

  <meta
    name="twitter:card"
    content="summary_large_image"
  >

  <meta
    name="twitter:title"
    id="twitterTitle"
    content="שמרו את התאריך"
  >

  <meta
    name="twitter:description"
    id="twitterDescription"
    content="הזמנה לחתונה"
  >

  <meta
    name="twitter:image"
    id="twitterImage"
    content=""
  >

  <meta
    name="twitter:image:alt"
    id="twitterImageAlt"
    content=""
  >


  <!-- ============================================================
       GOOGLE FONTS
       ============================================================ -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Assistant:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,500;1,600&display=swap"
    rel="stylesheet"
  >


  <style>

    /* ============================================================
       DESIGN TOKENS
       ============================================================ */

    :root{

      --cream:        #FAF6F0;
      --forest:       #2C3E35;
      --forest-soft:  #3E5347;
      --blush:        #E7C5B0;
      --gold:         #D4AF37;
      --gold-soft:    #E7CD79;
      --paper:        #FFFDFB;
      --line:         rgba(44,62,53,0.14);

      --font-display:
        'Frank Ruhl Libre',
        'David Libre',
        serif;

      --font-script:
        'Playfair Display',
        var(--font-display);

      --font-body:
        'Assistant',
        'Segoe UI',
        sans-serif;

      --radius-lg: 24px;
      --radius-md: 16px;

      --shadow-soft:
        0 18px 40px -18px rgba(44,62,53,0.35);

      --shadow-tight:
        0 8px 20px -10px rgba(44,62,53,0.30);

    }


    *{
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html{
      scroll-behavior: smooth;
    }


    body{

      background: var(--forest);

      color: var(--forest);

      font-family: var(--font-body);

      line-height: 1.5;

      -webkit-font-smoothing: antialiased;

      overflow-x: hidden;

    }


    img, video{
      max-width: 100%;
      display: block;
    }


    @media (prefers-reduced-motion: reduce){

      *,
      *::before,
      *::after{

        animation-duration: 0.01ms !important;

        animation-iteration-count: 1 !important;

        transition-duration: 0.01ms !important;

        scroll-behavior: auto !important;

      }

    }


    a:focus-visible,
    button:focus-visible{

      outline: 2px solid var(--gold);

      outline-offset: 3px;

    }


    /* ============================================================
       ONE-SCREEN HERO
       ============================================================ */

    .hero-full{

      position: relative;

      height: 100vh;

      height: 100dvh;

      width: 100%;

      display: flex;

      align-items: center;

      justify-content: center;

      overflow: hidden;

    }


    .hero-media{

      position: absolute;

      inset: 0;

      z-index: 0;

    }


    .hero-media img,
    .hero-media video{

      width: 100%;

      height: 100%;

      object-fit: cover;

      object-position: center 35%;

    }


    .hero-media::after{

      content: "";

      position: absolute;

      inset: 0;

      background:
        linear-gradient(
          180deg,
          rgba(20,24,20,0.32) 0%,
          rgba(20,24,20,0.22) 26%,
          rgba(20,24,20,0.5) 72%,
          rgba(14,18,14,0.72) 100%
        );

    }


    .hero-content{

      position: relative;

      z-index: 1;

      width: 100%;

      max-width: 620px;

      padding:
        clamp(16px, 4vh, 32px)
        24px;

      text-align: center;

      color: #fff;

      display: flex;

      flex-direction: column;

      align-items: center;

      max-height: 100%;

      overflow-y: auto;

      scrollbar-width: none;

    }


    .hero-content::-webkit-scrollbar{
      display: none;
    }


    .hero-content > *{

      opacity: 0;

      transform: translateY(12px);

      animation:
        hero-rise
        0.8s
        ease
        forwards;

    }


    .save-the-date{
      animation-delay: 0.05s;
    }


    .hero-names{
      animation-delay: 0.2s;
    }


    .cd-inline{
      animation-delay: 0.35s;
    }


    .hero-meta-block{
      animation-delay: 0.5s;
    }


    .btn-learnmore{
      animation-delay: 0.65s;
    }


    .hero-credit{
      animation-delay: 0.8s;
    }


    @keyframes hero-rise{

      to{

        opacity: 1;

        transform: translateY(0);

      }

    }


    .save-the-date{

      font-size:
        clamp(
          0.95rem,
          3.2vw,
          1.2rem
        );

      font-weight: 600;

      letter-spacing: 0.22em;

      text-transform: uppercase;

      color: #fff;

      text-shadow:
        0 2px 14px rgba(0,0,0,0.35);

      margin-bottom:
        clamp(
          10px,
          2.5vh,
          18px
        );

    }


    .hero-names{

      font-family: var(--font-display);

      font-weight: 500;

      font-size:
        clamp(
          2.3rem,
          8vw,
          3.6rem
        );

      line-height: 1.1;

      text-shadow:
        0 4px 30px rgba(0,0,0,0.4);

      margin-bottom:
        clamp(
          16px,
          3.5vh,
          28px
        );

    }


    .hero-names .amp{

      color: var(--gold-soft);

      font-style: italic;

      padding: 0 10px;

      display: inline-block;

    }


    /* ============================================================
       INLINE COUNTDOWN
       ============================================================ */

    .cd-inline{

      display: flex;

      align-items: center;

      justify-content: center;

      gap:
        clamp(
          10px,
          3vw,
          20px
        );

      margin-bottom:
        clamp(
          16px,
          3.5vh,
          28px
        );

    }


    .cd-item{

      display: flex;

      flex-direction: column;

      align-items: center;

      min-width: 40px;

    }


    .countdown-num{

      font-family: var(--font-display);

      font-weight: 600;

      font-size:
        clamp(
          3rem,
          6.5vw,
          2.4rem
        );

      color: #fff;

      line-height: 1;

      font-variant-numeric:
        tabular-nums;

      text-shadow:
        0 2px 14px rgba(0,0,0,0.35);

      display: inline-block;

      transition:
        transform 0.25s ease,
        opacity 0.25s ease;

    }


    .countdown-num.tick{

      transform:
        translateY(-4px);

      opacity: 0.5;

    }


    .countdown-label{

      margin-top: 4px;

      font-size: 1rem;

      letter-spacing: 0.04em;

      color:
        rgba(255,255,255,0.82);

    }


    .cd-bar{

      width: 1px;

      height:
        clamp(
          26px,
          5vh,
          36px
        );

      background:
        rgba(255,255,255,0.45);

      align-self: center;

      margin-top: -8px;

    }


    /* ============================================================
       WHERE / WHEN
       ============================================================ */

    .hero-meta-block{

      display: flex;

      flex-direction: column;

      gap:
        clamp(
          8px,
          2vh,
          14px
        );

      margin-bottom:
        clamp(
          18px,
          4vh,
          30px
        );

    }


    .meta-label{

      font-size: 1.5rem;

      letter-spacing: 0.14em;

      text-transform: uppercase;

      color:
        rgba(255,255,255,0.72);

      margin-bottom: 2px;

    }


    .meta-value{

      font-size:
        clamp(
          0.92rem,
          2.6vw,
          1.05rem
        );

      font-weight: 600;

      color: #fff;

      text-shadow:
        0 2px 10px rgba(0,0,0,0.3);

    }


    /* ============================================================
       CTA
       ============================================================ */

    .btn-learnmore{

      display: inline-flex;

      align-items: center;

      gap: 8px;

      background: #fff;

      color: var(--forest);

      font-weight: 700;

      letter-spacing: 0.03em;

      font-size:
        clamp(
          0.85rem,
          2.4vw,
          0.98rem
        );

      padding: 14px 30px;

      border: none;

      border-radius: 999px;

      cursor: pointer;

      box-shadow:
        0 12px 26px -10px
        rgba(0,0,0,0.45);

      transition:
        transform 0.15s ease;

    }


    .btn-learnmore:active{
      transform: scale(0.96);
    }


    .hero-credit{

      margin-top:
        clamp(
          14px,
          3vh,
          22px
        );

      font-size: 0.72rem;

      color:
        rgba(255,255,255,0.55);

    }


    /* ============================================================
       LANGUAGE TOGGLE
       ============================================================ */

    .lang-toggle{

      position: fixed;

      bottom: 18px;

      inset-inline-end: 18px;

      z-index: 50;

      display: inline-flex;

      align-items: center;

      gap: 6px;

      padding: 8px 14px;

      background:
        rgba(255,255,255,0.88);

      color: var(--forest);

      border:
        1px solid
        rgba(255,255,255,0.9);

      border-radius: 999px;

      font-family: var(--font-body);

      font-size: 0.78rem;

      font-weight: 600;

      cursor: pointer;

      box-shadow:
        var(--shadow-tight);

    }


    .lang-toggle svg{

      width: 14px;

      height: 14px;

      flex-shrink: 0;

    }


    .lang-toggle:active{
      transform: scale(0.96);
    }


    html[lang="en"] .hero-names,
    html[lang="en"] .modal-title{

      font-family:
        var(--font-script);

    }


    /* ============================================================
       RSVP MODAL
       ============================================================ */

    .modal-overlay{

      position: fixed;

      inset: 0;

      background:
        rgba(44,62,53,0.55);

      backdrop-filter: blur(3px);

      -webkit-backdrop-filter: blur(3px);

      z-index: 100;

      display: flex;

      align-items: flex-end;

      justify-content: center;

      opacity: 0;

      pointer-events: none;

      transition:
        opacity 0.35s ease;

    }


    .modal-overlay.is-open{

      opacity: 1;

      pointer-events: auto;

    }


    .modal-sheet{

      width: 100%;

      max-width: 480px;

      max-height: 88vh;

      background: var(--cream);

      color: var(--forest);

      border-radius:
        26px 26px 0 0;

      box-shadow:
        0 -20px 50px -20px
        rgba(44,62,53,0.5);

      display: flex;

      flex-direction: column;

      transform:
        translateY(100%);

      transition:
        transform 0.4s
        cubic-bezier(.32,.72,.35,1);

      padding-bottom:
        env(
          safe-area-inset-bottom,
          0px
        );

    }


    @media (min-width: 900px){

      .modal-overlay{

        align-items: center;

      }

      .modal-sheet{

        max-width: 560px;

        border-radius: 26px;

        max-height: 82vh;

      }

    }


    .modal-overlay.is-open
    .modal-sheet{

      transform:
        translateY(0);

    }


    .modal-header{

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 18px 20px;

      border-bottom:
        1px solid var(--line);

    }


    .modal-title{

      font-family:
        var(--font-display);

      font-size: 1.25rem;

    }


    .modal-close{

      width: 36px;

      height: 36px;

      border-radius: 50%;

      border:
        1px solid var(--line);

      background: var(--paper);

      color: var(--forest);

      font-size: 1.1rem;

      line-height: 1;

      cursor: pointer;

      display: flex;

      align-items: center;

      justify-content: center;

    }


    .modal-body{

      flex: 1;

      overflow-y: auto;

      padding: 20px;

      position: relative;

      min-height: 320px;

    }


    .modal-section{
      margin-bottom: 26px;
    }


    .modal-section h4{

      font-family:
        var(--font-display);

      font-size: 1.05rem;

      color: var(--forest);

      margin-bottom: 12px;

    }


    .mini-timeline{

      list-style: none;

    }


    .mini-timeline li{

      display: flex;

      gap: 10px;

      padding: 8px 0;

      border-bottom:
        1px dashed var(--line);

      font-size: 0.95rem;

      color: var(--forest-soft);

    }


    .mini-timeline li:last-child{

      border-bottom: none;

    }


    .mini-timeline strong{

      font-family:
        var(--font-display);

      color: var(--forest);

      min-width: 46px;

    }


    .venue-line{

      color: var(--forest-soft);

      font-size: 0.95rem;

      margin-bottom: 14px;

    }


    .map-embed{

      width: 100%;

      height: 170px;

      border: 0;

      border-radius:
        var(--radius-md);

      margin-bottom: 14px;

      filter:
        sepia(8%)
        saturate(85%);

    }


    .btn-waze{

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 10px;

      width: 100%;

      padding: 14px 18px;

      background: var(--forest);

      color: var(--cream);

      font-weight: 700;

      font-size: 1rem;

      border: none;

      border-radius: 999px;

      text-decoration: none;

      box-shadow:
        var(--shadow-tight);

      transition:
        transform 0.15s ease;

    }


    .btn-waze:active{

      transform:
        scale(0.97);

    }


    .btn-waze svg{

      width: 20px;

      height: 20px;

      flex-shrink: 0;

    }


    .rsvp-copy{

      color: var(--forest-soft);

      font-size: 0.95rem;

      margin-bottom: 16px;

    }


    .form-loader{

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      gap: 12px;

      color: var(--forest-soft);

      font-size: 0.95rem;

      padding: 40px 0;

    }


    .form-loader .spinner{

      width: 28px;

      height: 28px;

      border-radius: 50%;

      border:
        3px solid var(--blush);

      border-top-color:
        var(--gold);

      animation:
        spin 0.9s
        linear infinite;

    }


    @keyframes spin{

      to{
        transform: rotate(360deg);
      }

    }


    #rsvpIframe{

      width: 100%;

      min-height: 560px;

      border: 0;

      border-radius:
        var(--radius-md);

      background: transparent;

    }

  </style>

</head>


<body>


  <!-- ============================================================
       ONE-SCREEN HERO
       ============================================================ -->

  <section class="hero-full">


    <div class="hero-media">

      <video
        id="heroVideo"
        autoplay
        muted
        loop
        playsinline
        poster=""
        data-he-video=""
        data-en-video=""
      ></video>

      <img
        id="heroImage"
        src=""
        alt=""
        data-he-alt=""
        data-en-alt=""
        style="display: none;"
      >

    </div>


    <div class="hero-content">


      <h1
        class="save-the-date"
        data-en="Save the Date"
      >
        Save the Date
      </h1>


      <h2 class="hero-names">

        <span id="brideName"></span>

        <span class="amp">&</span>

        <span id="groomName"></span>

      </h2>


      <!-- ========================================================
           LIVE COUNTDOWN
           ======================================================== -->

      <div
        class="cd-inline"
        id="countdown"
      >

        <div class="cd-item">

          <span
            class="countdown-num"
            id="cd-days"
          >
            00
          </span>

          <span
            class="countdown-label"
            data-en="days"
          >
            ימים
          </span>

        </div>


        <span
          class="cd-bar"
          aria-hidden="true"
        ></span>


        <div class="cd-item">

          <span
            class="countdown-num"
            id="cd-hours"
          >
            00
          </span>

          <span
            class="countdown-label"
            data-en="hours"
          >
            שעות
          </span>

        </div>


        <span
          class="cd-bar"
          aria-hidden="true"
        ></span>


        <div class="cd-item">

          <span
            class="countdown-num"
            id="cd-minutes"
          >
            00
          </span>

          <span
            class="countdown-label"
            data-en="minutes"
          >
            דקות
          </span>

        </div>


        <span
          class="cd-bar"
          aria-hidden="true"
        ></span>


        <div class="cd-item">

          <span
            class="countdown-num"
            id="cd-seconds"
          >
            00
          </span>

          <span
            class="countdown-label"
            data-en="seconds"
          >
            שניות
          </span>

        </div>

      </div>


      <!-- ========================================================
           WHERE / WHEN
           ======================================================== -->

      <div class="hero-meta-block">


        <div>

          <p
            class="meta-label"
            data-en="Where"
          >
            איפה
          </p>

          <p
            class="meta-value"
            id="venue"
          ></p>

        </div>


        <div>

          <p
            class="meta-label"
            data-en="When"
          >
            מתי
          </p>

          <p
            class="meta-value"
            id="eventDate"
          ></p>

        </div>


      </div>


      <button
        class="btn-learnmore"
        id="openRsvp"
        type="button"
      >

        <span data-en="Learn More / RSVP">
          לאישור הגעה
        </span>

      </button>


      <p
        class="hero-credit"
        data-en="Made with love by dotpage 🤍"
      >
        נבנה באהבה על ידי dotpage 🤍
      </p>


    </div>

  </section>


  <!-- ============================================================
       LANGUAGE TOGGLE
       ============================================================ -->

  <button
    class="lang-toggle"
    id="langToggle"
    type="button"
    aria-label="Switch language"
  >

    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.6"
    >

      <circle
        cx="12"
        cy="12"
        r="9"
      />

      <path
        d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.7-3.8-9S9.5 5.6 12 3Z"
      />

    </svg>


    <span
      id="langToggleLabel"
      data-en-label="עברית"
      data-he-label="English"
    >
      English
    </span>

  </button>


  <!-- ============================================================
       RSVP MODAL
       ============================================================ -->

  <div
    class="modal-overlay"
    id="rsvpModal"
    aria-hidden="true"
  >

    <div
      class="modal-sheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
    >


      <div class="modal-header">

        <h3
          class="modal-title"
          id="modalTitle"
          data-en="Details & RSVP"
        >
        </h3>


        <button
          class="modal-close"
          id="closeRsvp"
          type="button"
          aria-label="סגירה"
        >
          ✕
        </button>

      </div>


      <div class="modal-body">


        <!-- ======================================================
             RSVP FORM
             ====================================================== -->

        <div
          class="modal-section"
          style="margin-bottom:0;"
        >


          <div
            class="form-loader"
            id="formLoader"
          >

            <div
              class="spinner"
              aria-hidden="true"
            ></div>

            <span
              data-en="Loading form..."
            >
              טוען את הטופס...
            </span>

          </div>


          <iframe
            id="rsvpIframe"
            src=""
            title="טופס אישור הגעה"
          >
            טוען...
          </iframe>


        </div>


      </div>

    </div>

  </div>


  <!-- ============================================================
       DYNAMIC INVITATION SCRIPT
       ============================================================ -->

  <script>

  (function () {

    "use strict";


    /* ============================================================
       GLOBAL DATA
       ============================================================ */

    var invitationData = null;

    var currentLang = "he";

    var countdownTimer = null;

    var WEDDING_DATE = null;


    /* ============================================================
       ELEMENTS
       ============================================================ */

    var els = {

      days:
        document.getElementById("cd-days"),

      hours:
        document.getElementById("cd-hours"),

      minutes:
        document.getElementById("cd-minutes"),

      seconds:
        document.getElementById("cd-seconds"),

      brideName:
        document.getElementById("brideName"),

      groomName:
        document.getElementById("groomName"),

      heroVideo:
        document.getElementById("heroVideo"),

      heroImage:
        document.getElementById("heroImage"),

      venue:
        document.getElementById("venue"),

      eventDate:
        document.getElementById("eventDate"),

      rsvpIframe:
        document.getElementById("rsvpIframe"),

      modal:
        document.getElementById("rsvpModal"),

      openRsvp:
        document.getElementById("openRsvp"),

      closeRsvp:
        document.getElementById("closeRsvp"),

      formLoader:
        document.getElementById("formLoader"),

      langToggle:
        document.getElementById("langToggle"),

      langToggleLabel:
        document.getElementById("langToggleLabel")

    };


    /* ============================================================
       SOCIAL / SEO META ELEMENTS
       ============================================================ */

    var metaEls = {

      description:
        document.getElementById("metaDescription"),

      canonical:
        document.getElementById("canonicalLink"),

      ogLocale:
        document.getElementById("ogLocale"),

      ogTitle:
        document.getElementById("ogTitle"),

      ogDescription:
        document.getElementById("ogDescription"),

      ogImage:
        document.getElementById("ogImage"),

      ogImageAlt:
        document.getElementById("ogImageAlt"),

      ogUrl:
        document.getElementById("ogUrl"),

      twitterTitle:
        document.getElementById("twitterTitle"),

      twitterDescription:
        document.getElementById("twitterDescription"),

      twitterImage:
        document.getElementById("twitterImage"),

      twitterImageAlt:
        document.getElementById("twitterImageAlt")

    };


    /* ============================================================
       1. GET CUSTOMER SLUG
       ============================================================ */

    function getInvitationSlug() {

      /*
         Local testing:

         /d2/?slug=maya-yair
      */

      var urlParams =
        new URLSearchParams(
          window.location.search
        );

      var paramSlug =
        urlParams.get("slug");


      if (paramSlug) {

        return paramSlug.trim();

      }


      /*
         Production:

         /d2/maya-yair/

         becomes:

         ["d2", "maya-yair"]
      */

      var pathParts =
        window.location.pathname
          .split("/")
          .filter(Boolean);


      if (
        pathParts.length >= 2
      ) {

        return pathParts[pathParts.length - 1].trim();

      }


      return null;

    }


    /* ============================================================
       2. FETCH INVITATION JSON
       ============================================================ */

    function loadInvitationData() {

      var slug = getInvitationSlug();


      if (!slug) {

        console.error("No invitation slug found in URL.");

        return;

      }


      var jsonUrl = "./data/" + slug + ".json";


      fetch(jsonUrl)

        .then(function (response) {

          if (!response.ok) {

            throw new Error("HTTP error " + response.status);

          }

          return response.json();

        })

        .then(function (data) {

          invitationData = data;

          initInvitation();

        })

        .catch(function (error) {

          console.error("Error loading invitation data:", error);

        });

    }


    /* ============================================================
       3. INITIALIZE INVITATION
       ============================================================ */

    function initInvitation() {

      if (!invitationData) return;


      WEDDING_DATE = new Date(invitationData.weddingDate);


      // Set static Hebrew & English values on elements

      if (els.brideName) {

        els.brideName.textContent = invitationData.brideName.he;

        els.brideName.setAttribute("data-he", invitationData.brideName.he);

        els.brideName.setAttribute("data-en", invitationData.brideName.en);

      }


      if (els.groomName) {

        els.groomName.textContent = invitationData.groomName.he;

        els.groomName.setAttribute("data-he", invitationData.groomName.he);

        els.groomName.setAttribute("data-en", invitationData.groomName.en);

      }


      if (els.venue) {

        els.venue.textContent = invitationData.venue.he;

        els.venue.setAttribute("data-he", invitationData.venue.he);

        els.venue.setAttribute("data-en", invitationData.venue.en);

      }


      if (els.eventDate) {

        els.eventDate.textContent = invitationData.eventDateText.he;

        els.eventDate.setAttribute("data-he", invitationData.eventDateText.he);

        els.eventDate.setAttribute("data-en", invitationData.eventDateText.en);

      }


      // Handle background media (Video vs. Image Fallback)

      var heroVideoSrcHe = invitationData.heroVideo ? invitationData.heroVideo.he : "";

      var heroVideoSrcEn = invitationData.heroVideo ? invitationData.heroVideo.en : heroVideoSrcHe;

      var heroImageSrcHe = invitationData.heroImage ? invitationData.heroImage.he : "";

      var heroImageSrcEn = invitationData.heroImage ? invitationData.heroImage.en : heroImageSrcHe;


      if (els.heroVideo) {

        els.heroVideo.setAttribute("data-he-video", heroVideoSrcHe);

        els.heroVideo.setAttribute("data-en-video", heroVideoSrcEn);

      }


      if (els.heroImage) {

        els.heroImage.setAttribute("data-he-alt", invitationData.brideName.he + " & " + invitationData.groomName.he);

        els.heroImage.setAttribute("data-en-alt", invitationData.brideName.en + " & " + invitationData.groomName.en);

        els.heroImage.src = heroImageSrcHe;

        if (els.heroVideo) {

          els.heroVideo.poster = heroImageSrcHe;

        }

      }


      if (heroVideoSrcHe && els.heroVideo) {

        els.heroVideo.src = heroVideoSrcHe;

        els.heroVideo.style.display = "block";

        if (els.heroImage) els.heroImage.style.display = "none";

      } else if (els.heroImage) {

        if (els.heroVideo) els.heroVideo.style.display = "none";

        els.heroImage.style.display = "block";

      }


      // Set Modal Title

      var modalTitle = document.getElementById("modalTitle");

      if (modalTitle) {

        modalTitle.textContent = invitationData.brideName.he + " & " + invitationData.groomName.he;

        modalTitle.setAttribute("data-he", invitationData.brideName.he + " & " + invitationData.groomName.he);

        modalTitle.setAttribute("data-en", invitationData.brideName.en + " & " + invitationData.groomName.en);

      }


      // Set Form Source

      if (els.rsvpIframe && invitationData.rsvpFormUrl) {

        els.rsvpIframe.src = invitationData.rsvpFormUrl;

      }


      // SEO / Social updates

      updateSeoMeta();


      // Start Countdown

      startCountdown();


      // Setup Modal Events

      setupModalEvents();


      // Setup Language Switcher Event

      if (els.langToggle) {

        els.langToggle.addEventListener("click", toggleLanguage);

      }

    }


    /* ============================================================
       4. SEO & META UPDATE
       ============================================================ */

    function updateSeoMeta() {

      var titleText = invitationData.brideName.he + " & " + invitationData.groomName.he + " - שמרו את התאריך";

      var descText = "הנכם מוזמנים לחתונה של " + invitationData.brideName.he + " ו" + invitationData.groomName.he + " ב-" + invitationData.eventDateText.he + " ב" + invitationData.venue.he;


      document.title = titleText;


      if (metaEls.description) metaEls.description.setAttribute("content", descText);

      if (metaEls.canonical) metaEls.canonical.setAttribute("href", window.location.href);


      if (metaEls.ogTitle) metaEls.ogTitle.setAttribute("content", titleText);

      if (metaEls.ogDescription) metaEls.ogDescription.setAttribute("content", descText);

      if (metaEls.ogUrl) metaEls.ogUrl.setAttribute("content", window.location.href);

      if (metaEls.ogImage && invitationData.heroImage) metaEls.ogImage.setAttribute("content", invitationData.heroImage.he);


      if (metaEls.twitterTitle) metaEls.twitterTitle.setAttribute("content", titleText);

      if (metaEls.twitterDescription) metaEls.twitterDescription.setAttribute("content", descText);

      if (metaEls.twitterImage && invitationData.heroImage) metaEls.twitterImage.setAttribute("content", invitationData.heroImage.he);

    }


    /* ============================================================
       5. COUNTDOWN TIMER
       ============================================================ */

    function startCountdown() {

      if (!WEDDING_DATE) return;


      function update() {

        var now = new Date().getTime();

        var distance = WEDDING_DATE.getTime() - now;


        if (distance < 0) {

          if (els.days) els.days.textContent = "00";

          if (els.hours) els.hours.textContent = "00";

          if (els.minutes) els.minutes.textContent = "00";

          if (els.seconds) els.seconds.textContent = "00";

          clearInterval(countdownTimer);

          return;

        }


        var days = Math.floor(distance / (1000 * 60 * 60 * 24));

        var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));

        var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));

        var seconds = Math.floor((distance % (1000 * 60)) / 1000);


        if (els.days) els.days.textContent = String(days).padStart(2, '0');

        if (els.hours) els.hours.textContent = String(hours).padStart(2, '0');

        if (els.minutes) els.minutes.textContent = String(minutes).padStart(2, '0');

        if (els.seconds) els.seconds.textContent = String(seconds).padStart(2, '0');

      }


      update();

      countdownTimer = setInterval(update, 1000);

    }


    /* ============================================================
       6. MODAL CONTROL
       ============================================================ */

    function setupModalEvents() {

      if (els.openRsvp) {

        els.openRsvp.addEventListener("click", function () {

          if (els.modal) {

            els.modal.classList.add("is-open");

            els.modal.setAttribute("aria-hidden", "false");

          }

        });

      }


      if (els.closeRsvp) {

        els.closeRsvp.addEventListener("click", function () {

          if (els.modal) {

            els.modal.classList.remove("is-open");

            els.modal.setAttribute("aria-hidden", "true");

          }

        });

      }


      if (els.modal) {

        els.modal.addEventListener("click", function (e) {

          if (e.target === els.modal) {

            els.modal.classList.remove("is-open");

            els.modal.setAttribute("aria-hidden", "true");

          }

        });

      }


      if (els.rsvpIframe) {

        els.rsvpIframe.addEventListener("load", function () {

          if (els.formLoader) {

            els.formLoader.style.display = "none";

          }

        });

      }

    }


    /* ============================================================
       7. LANGUAGE TOGGLE
       ============================================================ */

    function toggleLanguage() {

      currentLang = currentLang === "he" ? "en" : "he";


      var htmlEl = document.documentElement;

      htmlEl.setAttribute("lang", currentLang);

      htmlEl.setAttribute("dir", currentLang === "he" ? "rtl" : "ltr");


      // Toggle button label

      if (els.langToggleLabel) {

        els.langToggleLabel.textContent =

          currentLang === "he"

            ? els.langToggleLabel.getAttribute("data-he-label")

            : els.langToggleLabel.getAttribute("data-en-label");

      }


      // Update dynamic elements that have data-en / data-he

      var translatableEls = document.querySelectorAll("[data-en]");

      translatableEls.forEach(function (el) {

        if (currentLang === "en") {

          if (!el.getAttribute("data-he")) {

            el.setAttribute("data-he", el.textContent);

          }

          el.textContent = el.getAttribute("data-en");

        } else {

          if (el.getAttribute("data-he")) {

            el.textContent = el.getAttribute("data-he");

          }

        }

      });


      // Update background video / image source on language change if distinct

      if (els.heroVideo) {

        var newVideoSrc = currentLang === "en" ? els.heroVideo.getAttribute("data-en-video") : els.heroVideo.getAttribute("data-he-video");

        if (newVideoSrc && els.heroVideo.src !== newVideoSrc) {

          els.heroVideo.src = newVideoSrc;

        }

      }


      if (els.heroImage) {

        var newImgAlt = currentLang === "en" ? els.heroImage.getAttribute("data-en-alt") : els.heroImage.getAttribute("data-he-alt");

        els.heroImage.setAttribute("alt", newImgAlt || "");

      }

    }


    /* ============================================================
       INIT ON DOM LOAD
       ============================================================ */

    document.addEventListener("DOMContentLoaded", function () {

      loadInvitationData();

    });


  })();

  </script>

</body>
