<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Save the Date | נועה & תומר · 18.06.2027</title>

<!-- ============================================================
     GOOGLE FONTS
     - 'Frank Ruhl Libre': Hebrew-supporting serif for headlines
     - 'Assistant': Hebrew-supporting sans-serif for body copy
     - 'Playfair Display': swapped in for headlines in English mode
     ============================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Assistant:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">

<style>
  /* ============================================================
     DESIGN TOKENS
     ============================================================ */
  :root{
    --cream:        #FAF6F0;
    --forest:       #2C3E35;
    --forest-soft:  #3E5347;
    --blush:        #E7C5B0;
    --gold:         #D4AF37;
    --gold-soft:    #E7CD79;
    --paper:        #FFFDFB;
    --line:         rgba(44,62,53,0.14);

    --font-display: 'Frank Ruhl Libre', 'David Libre', serif;
    --font-script:  'Playfair Display', var(--font-display);
    --font-body:    'Assistant', 'Segoe UI', sans-serif;

    --radius-lg: 24px;
    --radius-md: 16px;

    --shadow-soft: 0 18px 40px -18px rgba(44,62,53,0.35);
    --shadow-tight: 0 8px 20px -10px rgba(44,62,53,0.30);
  }

  *{ box-sizing: border-box; margin: 0; padding: 0; }
  html{ scroll-behavior: smooth; }
  body{
    background: var(--forest);
    color: var(--forest);
    font-family: var(--font-body);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  img{ max-width: 100%; display: block; }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }
  a:focus-visible, button:focus-visible{
    outline: 2px solid var(--gold);
    outline-offset: 3px;
  }

  /* ============================================================
     ONE-SCREEN HERO
     Everything the visitor needs — title, names, countdown, where,
     when, and the call to action — lives inside this single
     full-viewport section, so nothing requires scrolling on either
     mobile or desktop. Extra detail (map, Waze, full schedule,
     the RSVP form) lives one tap away, inside the modal.
     ============================================================ */
  .hero-full{
    position: relative;
    height: 100vh;
    height: 100dvh; /* accounts for mobile browser chrome */
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .hero-media{ position: absolute; inset: 0; z-index: 0; }
  .hero-media img{
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center 35%;
  }
  /* 🔧 CUSTOMIZE: deepen these rgba alpha values if a brighter
     background photo is swapped in, to keep the white text legible */
  .hero-media::after{
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(20,24,20,0.32) 0%, rgba(20,24,20,0.22) 26%, rgba(20,24,20,0.5) 72%, rgba(14,18,14,0.72) 100%);
  }

  .hero-content{
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 620px;
    padding: clamp(16px, 4vh, 32px) 24px;
    text-align: center;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    /* Scales the whole block down gracefully on very short phone
       screens instead of letting content overflow the viewport */
    max-height: 100%;
    overflow-y: auto;
    scrollbar-width: none;
  }
  .hero-content::-webkit-scrollbar{ display: none; }

  /* Single orchestrated load-in for the whole block */
  .hero-content > *{
    opacity: 0;
    transform: translateY(12px);
    animation: hero-rise 0.8s ease forwards;
  }
  .save-the-date{ animation-delay: 0.05s; }
  .hero-names{ animation-delay: 0.2s; }
  .cd-inline{ animation-delay: 0.35s; }
  .hero-meta-block{ animation-delay: 0.5s; }
  .btn-learnmore{ animation-delay: 0.65s; }
  .hero-credit{ animation-delay: 0.8s; }
  @keyframes hero-rise{ to{ opacity: 1; transform: translateY(0); } }

  .save-the-date{
    font-size: clamp(0.95rem, 3.2vw, 1.2rem);
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 2px 14px rgba(0,0,0,0.35);
    margin-bottom: clamp(10px, 2.5vh, 18px);
  }

  .hero-names{
    font-family: var(--font-display);
    font-weight: 500;
    font-size: clamp(2.3rem, 8vw, 3.6rem);
    line-height: 1.1;
    text-shadow: 0 4px 30px rgba(0,0,0,0.4);
    margin-bottom: clamp(16px, 3.5vh, 28px);
  }
  .hero-names .amp{
    color: var(--gold-soft);
    font-style: italic;
    padding: 0 10px;
    display: inline-block;
  }

  /* ---------------- inline countdown ---------------- */
  .cd-inline{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 3vw, 20px);
    margin-bottom: clamp(16px, 3.5vh, 28px);
  }
  .cd-item{
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 40px;
  }
  .countdown-num{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(3rem, 6.5vw, 2.4rem);
    color: #fff;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 14px rgba(0,0,0,0.35);
    display: inline-block;
    transition: transform 0.25s ease, opacity 0.25s ease;
  }
  .countdown-num.tick{ transform: translateY(-4px); opacity: 0.5; }
  .countdown-label{
    margin-top: 4px;
    font-size: 1rem;
    letter-spacing: 0.04em;
    color: rgba(255,255,255,0.82);
  }
  .cd-bar{
    width: 1px;
    height: clamp(26px, 5vh, 36px);
    background: rgba(255,255,255,0.45);
    align-self: center;
    margin-top: -8px;
  }

  /* ---------------- where / when ---------------- */
  .hero-meta-block{
    display: flex;
    flex-direction: column;
    gap: clamp(8px, 2vh, 14px);
    margin-bottom: clamp(18px, 4vh, 30px);
  }
  .meta-label{
    font-size: 1.5rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.72);
    margin-bottom: 2px;
  }
  .meta-value{
    font-size: clamp(0.92rem, 2.6vw, 1.05rem);
    font-weight: 600;
    color: #fff;
    text-shadow: 0 2px 10px rgba(0,0,0,0.3);
  }

  /* ---------------- CTA ---------------- */
  .btn-learnmore{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #fff;
    color: var(--forest);
    font-weight: 700;
    letter-spacing: 0.03em;
    font-size: clamp(0.85rem, 2.4vw, 0.98rem);
    padding: 14px 30px;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 12px 26px -10px rgba(0,0,0,0.45);
    transition: transform 0.15s ease;
  }
  .btn-learnmore:active{ transform: scale(0.96); }

  .hero-credit{
    margin-top: clamp(14px, 3vh, 22px);
    font-size: 0.72rem;
    color: rgba(255,255,255,0.55);
  }

  /* ============================================================
     LANGUAGE TOGGLE — bottom corner, light pill, matches the
     reference design's placement and styling.
     ============================================================ */
  .lang-toggle{
    position: fixed;
    bottom: 18px;
    inset-inline-end: 18px;
    z-index: 50;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    background: rgba(255,255,255,0.88);
    color: var(--forest);
    border: 1px solid rgba(255,255,255,0.9);
    border-radius: 999px;
    font-family: var(--font-body);
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: var(--shadow-tight);
  }
  .lang-toggle svg{ width: 14px; height: 14px; flex-shrink: 0; }
  .lang-toggle:active{ transform: scale(0.96); }

  html[lang="en"] .hero-names,
  html[lang="en"] .modal-title{
    font-family: var(--font-script);
  }

  /* ============================================================
     RSVP MODAL — carries everything that isn't on the one screen:
     the full schedule, venue map + Waze, and the RSVP form itself.
     ============================================================ */
  .modal-overlay{
    position: fixed; inset: 0;
    background: rgba(44,62,53,0.55);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    z-index: 100;
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.35s ease;
  }
  .modal-overlay.is-open{ opacity: 1; pointer-events: auto; }

  .modal-sheet{
    width: 100%;
    max-width: 480px;
    max-height: 88vh;
    background: var(--cream);
    color: var(--forest);
    border-radius: 26px 26px 0 0;
    box-shadow: 0 -20px 50px -20px rgba(44,62,53,0.5);
    display: flex; flex-direction: column;
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(.32,.72,.35,1);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (min-width: 900px){
    .modal-overlay{ align-items: center; }
    .modal-sheet{ max-width: 560px; border-radius: 26px; max-height: 82vh; }
  }
  .modal-overlay.is-open .modal-sheet{ transform: translateY(0); }

  .modal-header{
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 20px;
    border-bottom: 1px solid var(--line);
  }
  .modal-title{ font-family: var(--font-display); font-size: 1.25rem; }
  .modal-close{
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--forest);
    font-size: 1.1rem; line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-body{ flex: 1; overflow-y: auto; padding: 20px; position: relative; min-height: 320px; }

  .modal-section{ margin-bottom: 26px; }
  .modal-section h4{
    font-family: var(--font-display);
    font-size: 1.05rem;
    color: var(--forest);
    margin-bottom: 12px;
  }

  .mini-timeline{ list-style: none; }
  .mini-timeline li{
    display: flex;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px dashed var(--line);
    font-size: 0.95rem;
    color: var(--forest-soft);
  }
  .mini-timeline li:last-child{ border-bottom: none; }
  .mini-timeline strong{
    font-family: var(--font-display);
    color: var(--forest);
    min-width: 46px;
  }

  .venue-line{ color: var(--forest-soft); font-size: 0.95rem; margin-bottom: 14px; }

  .map-embed{
    width: 100%;
    height: 170px;
    border: 0;
    border-radius: var(--radius-md);
    margin-bottom: 14px;
    filter: sepia(8%) saturate(85%);
  }

  .btn-waze{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 14px 18px;
    background: var(--forest);
    color: var(--cream);
    font-weight: 700;
    font-size: 1rem;
    border: none;
    border-radius: 999px;
    text-decoration: none;
    box-shadow: var(--shadow-tight);
    transition: transform 0.15s ease;
  }
  .btn-waze:active{ transform: scale(0.97); }
  .btn-waze svg{ width: 20px; height: 20px; flex-shrink: 0; }

  .rsvp-copy{ color: var(--forest-soft); font-size: 0.95rem; margin-bottom: 16px; }

  .form-loader{
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--forest-soft);
    font-size: 0.95rem;
    padding: 40px 0;
  }
  .form-loader .spinner{
    width: 28px; height: 28px; border-radius: 50%;
    border: 3px solid var(--blush); border-top-color: var(--gold);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  #rsvpIframe{
    width: 100%; min-height: 560px; border: 0;
    border-radius: var(--radius-md);
    background: transparent;
  }
</style>
</head>

<script>
(function () {
  "use strict";

  /* ---------------- Countdown timer ---------------- */
  // 🔧 CUSTOMIZE: set to your real wedding date/time
  var WEDDING_DATE = new Date("2027-06-18T19:30:00");
  var els = {
    days: document.getElementById("cd-days"),
    hours: document.getElementById("cd-hours"),
    minutes: document.getElementById("cd-minutes"),
    seconds: document.getElementById("cd-seconds")
  };
  var previous = { days: null, hours: null, minutes: null, seconds: null };
  function pad(n){ return String(n).padStart(2, "0"); }
  function renderUnit(el, key, value){
    var text = pad(value);
    if (previous[key] !== text){
      el.textContent = text;
      el.classList.add("tick");
      window.setTimeout(function(){ el.classList.remove("tick"); }, 250);
      previous[key] = text;
    }
  }
  function updateCountdown(){
    var distance = WEDDING_DATE.getTime() - new Date().getTime();
    if (distance <= 0){
      renderUnit(els.days,"days",0); renderUnit(els.hours,"hours",0);
      renderUnit(els.minutes,"minutes",0); renderUnit(els.seconds,"seconds",0);
      clearInterval(countdownTimer);
      return;
    }
    renderUnit(els.days, "days", Math.floor(distance/86400000));
    renderUnit(els.hours, "hours", Math.floor((distance%86400000)/3600000));
    renderUnit(els.minutes, "minutes", Math.floor((distance%3600000)/60000));
    renderUnit(els.seconds, "seconds", Math.floor((distance%60000)/1000));
  }
  updateCountdown();
  var countdownTimer = window.setInterval(updateCountdown, 1000);

  /* ---------------- RSVP modal ---------------- */
  var modal = document.getElementById("rsvpModal");
  var openBtn = document.getElementById("openRsvp");
  var closeBtn = document.getElementById("closeRsvp");
  var iframe = document.getElementById("rsvpIframe");
  var loader = document.getElementById("formLoader");
  var lastFocused = null;
  function openModal(){
    lastFocused = document.activeElement;
    modal.classList.add("is-open");
    modal.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
    closeBtn.focus();
  }
  function closeModal(){
    modal.classList.remove("is-open");
    modal.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
    if (lastFocused) lastFocused.focus();
  }
  openBtn.addEventListener("click", openModal);
  closeBtn.addEventListener("click", closeModal);
  modal.addEventListener("click", function(e){ if (e.target === modal) closeModal(); });
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape" && modal.classList.contains("is-open")) closeModal();
  });
  iframe.addEventListener("load", function(){ loader.style.display = "none"; });

  /* ---------------- Language toggle ---------------- */
  var htmlEl = document.documentElement;
  var langToggle = document.getElementById("langToggle");
  var langToggleLabel = document.getElementById("langToggleLabel");
  var translatable = document.querySelectorAll("[data-en]");
  var currentLang = "he";
  function applyLanguage(lang){
    translatable.forEach(function(el){
      if (!el.dataset.he) el.dataset.he = el.textContent;
      el.textContent = lang === "en" ? el.dataset.en : el.dataset.he;
    });
    var heroImg = document.querySelector(".hero-media img");
    if (heroImg && heroImg.dataset.enAlt){
      heroImg.alt = lang === "en" ? heroImg.dataset.enAlt : heroImg.dataset.heAlt;
    }
    htmlEl.setAttribute("lang", lang);
    htmlEl.setAttribute("dir", lang === "en" ? "ltr" : "rtl");
    langToggleLabel.textContent = lang === "en" ? "עברית" : "English";
    currentLang = lang;
  }
  langToggle.addEventListener("click", function(){
    applyLanguage(currentLang === "he" ? "en" : "he");
  });

})();
</script>

</body>
</html>
