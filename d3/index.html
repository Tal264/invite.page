  rel="stylesheet"
>

<style>

  /* ============================================================
     DESIGN TOKENS
     ============================================================ */

  :root{
    --cream:        #FAF6F0;
    --forest:       #2C3E35;
    --forest-soft:  #3E5347;
    --blush:        #E7C5B0;
    --gold:         #D4AF37;
    --gold-soft:    #E7CD79;
    --paper:        #FFFDFB;
    --line:         rgba(44,62,53,0.14);

    --font-display: 'Frank Ruhl Libre', 'David Libre', serif;
    --font-script:  'Playfair Display', var(--font-display);
    --font-body:    'Assistant', 'Segoe UI', sans-serif;

    --radius-lg: 24px;
    --radius-md: 16px;

    --shadow-soft: 0 18px 40px -18px rgba(44,62,53,0.35);
    --shadow-tight: 0 8px 20px -10px rgba(44,62,53,0.30);
  }


  /* ============================================================
     GLOBAL
     ============================================================ */

  *{
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html{
    scroll-behavior: smooth;
  }

  body{
    background: var(--forest);
    color: var(--forest);
    font-family: var(--font-body);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  img{
    max-width: 100%;
    display: block;
  }

  @media (prefers-reduced-motion: reduce){

    *,
    *::before,
    *::after{

      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;

    }

  }

  a:focus-visible,
  button:focus-visible{

    outline: 2px solid var(--gold);
    outline-offset: 3px;

  }


  /* ============================================================
     ONE-SCREEN HERO
     ============================================================ */

  .hero-full{

    position: relative;

    height: 100vh;
    height: 100dvh;

    width: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    background: var(--forest);

  }


  /* ============================================================
     HERO IMAGE
     ============================================================ */

  .hero-media{

    position: absolute;
    inset: 0;

    z-index: 0;

    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    background: var(--forest);

  }

  .hero-media img{

    width: 100%;
    height: 100%;

    object-fit: contain;

    object-position: center center;

  }


  /* ============================================================
     HERO IMAGE OVERLAY
     ============================================================ */

  .hero-media::after{

    content: "";

    position: absolute;
    inset: 0;

    background:
      linear-gradient(
        180deg,
        rgba(20,24,20,0.32) 0%,
        rgba(20,24,20,0.22) 26%,
        rgba(20,24,20,0.50) 72%,
        rgba(14,18,14,0.72) 100%
      );

    pointer-events: none;

  }


  /* ============================================================
     HERO CONTENT
     ============================================================ */

  .hero-content{

    position: relative;
    z-index: 1;

    width: 100%;
    max-width: 620px;

    padding:
      clamp(16px, 4vh, 32px)
      24px;

    text-align: center;

    color: #fff;

    display: flex;
    flex-direction: column;
    align-items: center;

    max-height: 100%;
    overflow-y: auto;

    scrollbar-width: none;

  }

  .hero-content::-webkit-scrollbar{
    display: none;
  }


  /* ============================================================
     HERO ANIMATION
     ============================================================ */

  .hero-content > *{

    opacity: 0;

    transform: translateY(12px);

    animation:
      hero-rise 0.8s ease forwards;

  }

  .save-the-date{
    animation-delay: 0.05s;
  }

  .hero-names{
    animation-delay: 0.2s;
  }

  .cd-inline{
    animation-delay: 0.35s;
  }

  .hero-meta-block{
    animation-delay: 0.5s;
  }

  .btn-learnmore{
    animation-delay: 0.65s;
  }

  .hero-credit{
    animation-delay: 0.8s;
  }

  @keyframes hero-rise{

    to{
      opacity: 1;
      transform: translateY(0);
    }

  }


  /* ============================================================
     SAVE THE DATE
     ============================================================ */

  .save-the-date{

    font-size:
      clamp(0.95rem, 3.2vw, 1.2rem);

    font-weight: 600;

    letter-spacing: 0.22em;

    text-transform: uppercase;

    color: #fff;

    text-shadow:
      0 2px 14px rgba(0,0,0,0.35);

    margin-bottom:
      clamp(10px, 2.5vh, 18px);

  }


  /* ============================================================
     NAMES
     ============================================================ */

  .hero-names{

    font-family: var(--font-display);

    font-weight: 500;

    font-size:
      clamp(2.3rem, 8vw, 3.6rem);

    line-height: 1.1;

    text-shadow:
      0 4px 30px rgba(0,0,0,0.4);

    margin-bottom:
      clamp(16px, 3.5vh, 28px);

  }

  .hero-names .amp{

    color: var(--gold-soft);

    font-style: italic;

    padding: 0 10px;

    display: inline-block;

  }


  /* ============================================================
     COUNTDOWN
     ============================================================ */

  .cd-inline{

    display: flex;

    align-items: center;
    justify-content: center;

    gap:
      clamp(10px, 3vw, 20px);

    margin-bottom:
      clamp(16px, 3.5vh, 28px);

  }

  .cd-item{

    display: flex;

    flex-direction: column;

    align-items: center;

    min-width: 40px;

  }

  .countdown-num{

    font-family: var(--font-display);

    font-weight: 600;

    font-size:
      clamp(2.4rem, 6.5vw, 3rem);

    color: #fff;

    line-height: 1;

    font-variant-numeric: tabular-nums;

    text-shadow:
      0 2px 14px rgba(0,0,0,0.35);

    display: inline-block;

    transition:
      transform 0.25s ease,
      opacity 0.25s ease;

  }

  .countdown-num.tick{

    transform: translateY(-4px);

    opacity: 0.5;

  }

  .countdown-label{

    margin-top: 4px;

    font-size: 1rem;

    letter-spacing: 0.04em;

    color:
      rgba(255,255,255,0.82);

  }

  .cd-bar{

    width: 1px;

    height:
      clamp(26px, 5vh, 36px);

    background:
      rgba(255,255,255,0.45);

    align-self: center;

    margin-top: -8px;

  }


  /* ============================================================
     WHERE / WHEN
     ============================================================ */

  .hero-meta-block{

    display: flex;

    flex-direction: column;

    gap:
      clamp(8px, 2vh, 14px);

    margin-bottom:
      clamp(18px, 4vh, 30px);

  }

  .meta-label{

    font-size: 1.5rem;

    letter-spacing: 0.14em;

    text-transform: uppercase;

    color:
      rgba(255,255,255,0.72);

    margin-bottom: 2px;

  }

  .meta-value{

    font-size:
      clamp(0.92rem, 2.6vw, 1.05rem);

    font-weight: 600;

    color: #fff;

    text-shadow:
      0 2px 10px rgba(0,0,0,0.3);

  }


  /* ============================================================
     CTA
     ============================================================ */

  .btn-learnmore{

    display: inline-flex;

    align-items: center;
    justify-content: center;

    gap: 8px;

    background: #fff;

    color: var(--forest);

    font-weight: 700;

    letter-spacing: 0.03em;

    font-size:
      clamp(0.85rem, 2.4vw, 0.98rem);

    padding: 14px 30px;

    border: none;

    border-radius: 999px;

    cursor: pointer;

    box-shadow:
      0 12px 26px -10px rgba(0,0,0,0.45);

    transition:
      transform 0.15s ease;

  }

  .btn-learnmore:active{
    transform: scale(0.96);
  }


  /* ============================================================
     CREDIT
     ============================================================ */

  .hero-credit{

    margin-top:
      clamp(14px, 3vh, 22px);

    font-size: 0.72rem;

    color:
      rgba(255,255,255,0.55);

  }


  /* ============================================================
     LANGUAGE TOGGLE
     ============================================================ */

  .lang-toggle{

    position: fixed;

    bottom: 18px;

    inset-inline-end: 18px;

    z-index: 50;

    display: inline-flex;

    align-items: center;

    gap: 6px;

    padding: 8px 14px;

    background:
      rgba(255,255,255,0.88);

    color: var(--forest);

    border:
      1px solid rgba(255,255,255,0.9);

    border-radius: 999px;

    font-family: var(--font-body);

    font-size: 0.78rem;

    font-weight: 600;

    cursor: pointer;

    box-shadow:
      var(--shadow-tight);

  }

  .lang-toggle svg{

    width: 14px;
    height: 14px;

    flex-shrink: 0;

  }

  .lang-toggle:active{
    transform: scale(0.96);
  }


  /* ============================================================
     ENGLISH FONT
     ============================================================ */

  html[lang="en"] .hero-names,
  html[lang="en"] .modal-title{

    font-family: var(--font-script);

  }


  /* ============================================================
     RSVP MODAL
     ============================================================ */

  .modal-overlay{

    position: fixed;
    inset: 0;

    background:
      rgba(44,62,53,0.55);

    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);

    z-index: 100;

    display: flex;

    align-items: flex-end;
    justify-content: center;

    opacity: 0;

    pointer-events: none;

    transition:
      opacity 0.35s ease;

  }

  .modal-overlay.is-open{

    opacity: 1;

    pointer-events: auto;

  }

  .modal-sheet{

    width: 100%;

    max-width: 480px;

    max-height: 88vh;

    background: var(--cream);

    color: var(--forest);

    border-radius:
      26px 26px 0 0;

    box-shadow:
      0 -20px 50px -20px
      rgba(44,62,53,0.5);

    display: flex;

    flex-direction: column;

    transform:
      translateY(100%);

    transition:
      transform 0.4s
      cubic-bezier(.32,.72,.35,1);

    padding-bottom:
      env(safe-area-inset-bottom, 0px);

  }

  @media (min-width: 900px){

    .modal-overlay{
      align-items: center;
    }

    .modal-sheet{

      max-width: 560px;

      border-radius: 26px;

      max-height: 82vh;

    }

  }

  .modal-overlay.is-open .modal-sheet{
    transform: translateY(0);
  }


  /* ============================================================
     MODAL HEADER
     ============================================================ */

  .modal-header{

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 18px 20px;

    border-bottom:
      1px solid var(--line);

  }

  .modal-title{

    font-family: var(--font-display);

    font-size: 1.25rem;

  }

  .modal-close{

    width: 36px;
    height: 36px;

    border-radius: 50%;

    border:
      1px solid var(--line);

    background: var(--paper);

    color: var(--forest);

    font-size: 1.1rem;

    line-height: 1;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;

  }

  .modal-body{

    flex: 1;

    overflow-y: auto;

    padding: 20px;

    position: relative;

    min-height: 320px;

  }


  /* ============================================================
     MODAL SECTIONS
     ============================================================ */

  .modal-section{
    margin-bottom: 26px;
  }

  .modal-section h4{

    font-family: var(--font-display);

    font-size: 1.05rem;

    color: var(--forest);

    margin-bottom: 12px;

  }

  .mini-timeline{
    list-style: none;
  }

  .mini-timeline li{

    display: flex;

    gap: 10px;

    padding: 8px 0;

    border-bottom:
      1px dashed var(--line);

    font-size: 0.95rem;

    color: var(--forest-soft);

  }

  .mini-timeline li:last-child{
    border-bottom: none;
  }

  .mini-timeline strong{

    font-family: var(--font-display);

    color: var(--forest);

    min-width: 46px;

  }

  .venue-line{

    color: var(--forest-soft);

    font-size: 0.95rem;

    margin-bottom: 14px;

  }


  /* ============================================================
     MAP
     ============================================================ */

  .map-embed{

    width: 100%;

    height: 170px;

    border: 0;

    border-radius:
      var(--radius-md);

    margin-bottom: 14px;

    filter:
      sepia(8%) saturate(85%);

  }


  /* ============================================================
     WAZE BUTTON
     ============================================================ */

  .btn-waze{

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 10px;

    width: 100%;

    padding: 14px 18px;

    background: var(--forest);

    color: var(--cream);

    font-weight: 700;

    font-size: 1rem;

    border: none;

    border-radius: 999px;

    text-decoration: none;

    box-shadow:
      var(--shadow-tight);

    transition:
      transform 0.15s ease;

  }

  .btn-waze:active{
    transform: scale(0.97);
  }

  .btn-waze svg{

    width: 20px;
    height: 20px;

    flex-shrink: 0;

  }


  /* ============================================================
     RSVP
     ============================================================ */

  .rsvp-copy{

    color: var(--forest-soft);

    font-size: 0.95rem;

    margin-bottom: 16px;

  }

  .form-loader{

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 12px;

    color: var(--forest-soft);

    font-size: 0.95rem;

    padding: 40px 0;

  }

  .form-loader .spinner{

    width: 28px;
    height: 28px;

    border-radius: 50%;

    border:
      3px solid var(--blush);

    border-top-color:
      var(--gold);

    animation:
      spin 0.9s linear infinite;

  }

  @keyframes spin{

    to{
      transform: rotate(360deg);
    }

  }

  #rsvpIframe{

    width: 100%;

    min-height: 560px;

    border: 0;

    border-radius:
      var(--radius-md);

    background: transparent;

  }


  /* ============================================================
     RESPONSIVE IMAGE BEHAVIOR
     ============================================================ */

  @media (max-width: 600px){

    .hero-media{
      background: #26372f;
    }

    .hero-media img{

      width: 100%;
      height: 100%;

      object-fit: contain;

      object-position: center center;

    }

    .hero-content{

      padding-left: 18px;
      padding-right: 18px;

    }

  }


  /* ============================================================
     VERY SHORT SCREENS
     ============================================================ */

  @media (max-height: 700px){

    .hero-content{

      padding-top: 12px;
      padding-bottom: 12px;

    }

    .hero-names{
      margin-bottom: 14px;
    }

    .cd-inline{
      margin-bottom: 14px;
    }

    .hero-meta-block{
      margin-bottom: 16px;
    }

    .hero-credit{
      margin-top: 10px;
    }

  }

</style>
</head>


<body>


<!-- ============================================================
     ONE-SCREEN HERO
     ============================================================ -->

<section class="hero-full">

  <div class="hero-media">

    <img
      id="heroImage"
      src=""
      alt=""
      data-he-alt=""
      data-en-alt=""
    >

  </div>


  <!-- ==========================================================
       HERO CONTENT
       ========================================================== -->

  <div class="hero-content">

    <h1
      class="save-the-date"
      data-en="Save the Date"
    >
      החתונה שלנו
    </h1>


    <h2 class="hero-names">

      <span id="brideName"></span>

      <span class="amp">&</span>

      <span id="groomName"></span>

    </h2>


    <!-- ========================================================
         LIVE COUNTDOWN
         ======================================================== -->

    <div
      class="cd-inline"
      id="countdown"
    >

      <div class="cd-item">

        <span
          class="countdown-num"
          id="cd-days"
        >
          00
        </span>

        <span
          class="countdown-label"
          data-en="days"
        >
          ימים
        </span>

      </div>


      <span
        class="cd-bar"
        aria-hidden="true"
      ></span>


      <div class="cd-item">

        <span
          class="countdown-num"
          id="cd-hours"
        >
          00
        </span>

        <span
          class="countdown-label"
          data-en="hours"
        >
          שעות
        </span>

      </div>


      <span
        class="cd-bar"
        aria-hidden="true"
      ></span>


      <div class="cd-item">

        <span
          class="countdown-num"
          id="cd-minutes"
        >
          00
        </span>

        <span
          class="countdown-label"
          data-en="minutes"
        >
          דקות
        </span>

      </div>


      <span
        class="cd-bar"
        aria-hidden="true"
      ></span>


      <div class="cd-item">

        <span
          class="countdown-num"
          id="cd-seconds"
        >
          00
        </span>

        <span
          class="countdown-label"
          data-en="seconds"
        >
          שניות
        </span>

      </div>

    </div>


    <!-- ========================================================
         WHERE / WHEN
         ======================================================== -->

    <div class="hero-meta-block">

      <div>

        <p
          class="meta-label"
          data-en="Where"
        >
          איפה
        </p>

        <p
          class="meta-value"
          id="venueName"
        ></p>

      </div>


      <div>

        <p
          class="meta-label"
          data-en="When"
        >
          מתי
        </p>

        <p
          class="meta-value"
          id="eventDate"
        ></p>

      </div>

    </div>


    <!-- ========================================================
         CTA
         ======================================================== -->

    <button
      class="btn-learnmore"
      id="openRsvp"
      type="button"
    >

      <span data-en="Learn More / RSVP">
        לאישור הגעה
      </span>

    </button>


    <!-- ========================================================
         CREDIT
         ======================================================== -->

    <p
      class="hero-credit"
      data-en="Made with love by dotpage 🤍"
    >
      נבנה באהבה על ידי dotpage 🤍
    </p>

  </div>

</section>



<!-- ============================================================
     LANGUAGE TOGGLE
     ============================================================ -->

<button
  class="lang-toggle"
  id="langToggle"
  type="button"
  aria-label="Switch language"
>

  <svg
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.6"
  >

    <circle
      cx="12"
      cy="12"
      r="9"
    />

    <path
      d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-6.4-3.8-9S9.5 5.6 12 3Z"
    />

  </svg>


  <span
    id="langToggleLabel"
    data-en-label="עברית"
    data-he-label="English"
  >
    English
  </span>

</button>



<!-- ============================================================
     RSVP MODAL
     ============================================================ -->

<div
  class="modal-overlay"
  id="rsvpModal"
  aria-hidden="true"
>

  <div
    class="modal-sheet"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalTitle"
  >


    <!-- ========================================================
         MODAL HEADER
         ======================================================== -->

    <div class="modal-header">

      <h3
        class="modal-title"
        id="modalTitle"
        data-en="Details & RSVP"
      >
        פרטים ואישור הגעה
      </h3>


      <button
        class="modal-close"
        id="closeRsvp"
        type="button"
        aria-label="סגירה"
      >
        ✕
      </button>

    </div>


    <!-- ========================================================
         MODAL BODY
         ======================================================== -->

    <div class="modal-body">


      <!-- ======================================================
           RSVP FORM
           ====================================================== -->

      <div
        class="modal-section"
        style="margin-bottom:0;"
      >

        <div
          class="form-loader"
          id="formLoader"
        >

          <div
            class="spinner"
            aria-hidden="true"
          ></div>

          <span data-en="Loading form...">
            טוען את הטופס...
          </span>

        </div>


        <iframe
          id="rsvpIframe"
          src=""
          title="טופס אישור הגעה"
        >
          טוען...
        </iframe>

      </div>

    </div>

  </div>

</div>



<script>

(function () {

  "use strict";


  /* ==========================================================
     GLOBAL DATA
     ========================================================== */

  var invitationData = null;

  var currentLang = "he";

  var countdownTimer = null;

  var WEDDING_DATE = null;


  /* ==========================================================
     DOM ELEMENTS
     ========================================================== */

  var els = {

    brideName:
      document.getElementById("brideName"),

    groomName:
      document.getElementById("groomName"),

    venueName:
      document.getElementById("venueName"),

    eventDate:
      document.getElementById("eventDate"),

    heroImage:
      document.getElementById("heroImage"),

    days:
      document.getElementById("cd-days"),

    hours:
      document.getElementById("cd-hours"),

    minutes:
      document.getElementById("cd-minutes"),

    seconds:
      document.getElementById("cd-seconds"),

    rsvpIframe:
      document.getElementById("rsvpIframe")

  };


  /* ==========================================================
     SOCIAL METADATA ELEMENTS
     ========================================================== */

  var metaDescription =
    document.getElementById(
      "metaDescription"
    );

  var ogLocale =
    document.getElementById(
      "ogLocale"
    );

  var ogTitle =
    document.getElementById(
      "ogTitle"
    );

  var ogDescription =
    document.getElementById(
      "ogDescription"
    );

  var ogImage =
    document.getElementById(
      "ogImage"
    );

  var ogImageAlt =
    document.getElementById(
      "ogImageAlt"
    );

  var ogUrl =
    document.getElementById(
      "ogUrl"
    );

  var twitterTitle =
    document.getElementById(
      "twitterTitle"
    );

  var twitterDescription =
    document.getElementById(
      "twitterDescription"
    );

  var twitterImage =
    document.getElementById(
      "twitterImage"
    );

  var twitterImageAlt =
    document.getElementById(
      "twitterImageAlt"
    );

  var canonicalLink =
    document.getElementById(
      "canonicalLink"
    );


  /* ==========================================================
     GET ABSOLUTE URL

     Converts:

     /assets/image.jpg

     into:

     https://invitewed.pages.dev/assets/image.jpg
     ========================================================== */

  function getAbsoluteUrl(url){

    if (!url){
      return "";
    }

    try{

      return new URL(
        url,
        window.location.origin
      ).href;

    }catch(error){

      return url;

    }

  }


  /* ==========================================================
     UPDATE SOCIAL SHARING METADATA
     ========================================================== */

  function updateSocialMetadata(){

    if (!invitationData){
      return;
    }


    var data =
      invitationData;


    var brideHe =
      data.brideNameHe || "";

    var groomHe =
      data.groomNameHe || "";

    var brideEn =
      data.brideNameEn || "";

    var groomEn =
      data.groomNameEn || "";

    var venueHe =
      data.venueHe ||
      data.venueEn ||
      "";

    var venueEn =
      data.venueEn ||
      data.venueHe ||
      "";

    var date =
      data.date || "";


    /* ----------------------------------------------------------
       Names
       ---------------------------------------------------------- */

    var coupleHe =
      brideHe && groomHe
        ? brideHe + " ו" + groomHe
        : (
            brideHe ||
            groomHe ||
            "הזמנה לחתונה"
          );


    var coupleEn =
      brideEn && groomEn
        ? brideEn + " & " + groomEn
        : (
            brideEn ||
            groomEn ||
            "Wedding Invitation"
          );


    /* ----------------------------------------------------------
       Hebrew social metadata
       ---------------------------------------------------------- */

    var titleHe =
      brideHe && groomHe

        ? brideHe +
          " & " +
          groomHe +
          " | שמרו את התאריך"

        : "שמרו את התאריך";


    var descriptionHe =
      [
        coupleHe + " מתחתנים ❤️",
        date,
        venueHe
      ]
      .filter(Boolean)
      .join(" · ");


    /* ----------------------------------------------------------
       English social metadata
       ---------------------------------------------------------- */

    var titleEn =
      brideEn && groomEn

        ? coupleEn +
          " | Save the Date"

        : "Save the Date";


    var descriptionEn =
      [
        coupleEn +
          " are getting married ❤️",
        date,
        venueEn
      ]
      .filter(Boolean)
      .join(" · ");


    /* ----------------------------------------------------------
       Current language
       ---------------------------------------------------------- */

    var title =
      currentLang === "en"
        ? titleEn
        : titleHe;


    var description =
      currentLang === "en"
        ? descriptionEn
        : descriptionHe;


    var imageUrl =
      getAbsoluteUrl(
        data.heroImage || ""
      );


    /*
      Use the clean invitation URL without
      query parameters such as ?slug=...
    */

    var pageUrl =
      window.location.origin +
      window.location.pathname;


    var imageAlt =
      currentLang === "en"

        ? (
            brideEn && groomEn
              ? brideEn +
                " and " +
                groomEn
              : "Wedding invitation"
          )

        : (
            brideHe && groomHe
              ? brideHe +
                " ו" +
                groomHe
              : "הזמנה לחתונה"
          );


    /* ----------------------------------------------------------
       Browser description
       ---------------------------------------------------------- */

    if (metaDescription){

      metaDescription.setAttribute(
        "content",
        description
      );

    }


    /* ----------------------------------------------------------
       Open Graph
       ---------------------------------------------------------- */

    if (ogLocale){

      ogLocale.setAttribute(
        "content",
        currentLang === "en"
          ? "en_US"
          : "he_IL"
      );

    }


    if (ogTitle){

      ogTitle.setAttribute(
        "content",
        title
      );

    }


    if (ogDescription){

      ogDescription.setAttribute(
        "content",
        description
      );

    }


    if (ogImage){

      ogImage.setAttribute(
        "content",
        imageUrl
      );

    }


    if (ogImageAlt){

      ogImageAlt.setAttribute(
        "content",
        imageAlt
      );

    }


    if (ogUrl){

      ogUrl.setAttribute(
        "content",
        pageUrl
      );

    }


    /* ----------------------------------------------------------
       Twitter
       ---------------------------------------------------------- */

    if (twitterTitle){

      twitterTitle.setAttribute(
        "content",
        title
      );

    }


    if (twitterDescription){

      twitterDescription.setAttribute(
        "content",
        description
      );

    }


    if (twitterImage){

      twitterImage.setAttribute(
        "content",
        imageUrl
      );

    }


    if (twitterImageAlt){

      twitterImageAlt.setAttribute(
        "content",
        imageAlt
      );

    }


    /* ----------------------------------------------------------
       Canonical URL
       ---------------------------------------------------------- */

    if (canonicalLink){

      canonicalLink.setAttribute(
        "href",
        pageUrl
      );

    }

  }


  /* ==========================================================
     GET CUSTOMER SLUG

     Supported URLs:

     /d3/maya-yair/
     /d3/noa-tomer/

     Local testing:

     /d3/?slug=maya-yair
     ========================================================== */

  function getInvitationSlug() {

    /* ----------------------------------------------------------
       1. Local testing / query parameter
       ---------------------------------------------------------- */

    var urlParams =
      new URLSearchParams(
        window.location.search
      );

    var paramSlug =
      urlParams.get("slug");

    if (paramSlug) {

      return paramSlug.trim();

    }


    /* ----------------------------------------------------------
       2. Production URL
       ---------------------------------------------------------- */

    var pathParts =
      window.location.pathname
        .split("/")
        .filter(Boolean);


    /*
      Expected:

      ["d3", "maya-yair"]

      or

      ["d3", "noa-tomer"]
    */

    if (

      pathParts.length >= 2 &&

      /^d[1-4]$/i.test(
        pathParts[0]
      ) &&

      pathParts[1].trim() !== "" &&

      !pathParts[1]
        .toLowerCase()
        .endsWith(".html")

    ){

      return pathParts[1].trim();

    }


    return null;

  }


  /* ==========================================================
     LOAD CUSTOMER DATA
     ========================================================== */

  async function loadInvitation(){

    var slug =
      getInvitationSlug();


    if (!slug){

      console.error(
        "No invitation slug found in URL:",
        window.location.href
      );

      showError(
        "Invitation not found."
      );

      return;

    }


    try{

      /*
        All invitation designs use
        the same centralized customer data.

        Example:

        /data/maya-yair.json
        /data/noa-tomer.json
      */

      var dataUrl =
        "/data/" +
        encodeURIComponent(slug) +
        ".json";


      console.log(
        "Loading invitation data:",
        dataUrl
      );


      var response =
        await fetch(
          dataUrl,
          {
            cache: "no-cache"
          }
        );


      if (!response.ok){

        throw new Error(
          "Invitation data not found: " +
          slug +
          " (" +
          response.status +
          ")"
        );

      }


      invitationData =
        await response.json();


      applyInvitationData();


      document.body.classList.add(
        "invitation-ready"
      );


    }catch(error){

      console.error(
        "Failed to load invitation:",
        error
      );


      showError(
        "Unable to load this invitation."
      );

    }

  }


  /* ==========================================================
     APPLY CUSTOMER DATA
     ========================================================== */

  function applyInvitationData(){

    var data =
      invitationData;


    if (!data){
      return;
    }


    /* ----------------------------------------------------------
       Couple names
       ---------------------------------------------------------- */

    if (els.brideName){

      els.brideName.dataset.he =
        data.brideNameHe || "";

      els.brideName.dataset.en =
        data.brideNameEn || "";

      els.brideName.textContent =
        currentLang === "en"
          ? data.brideNameEn || ""
          : data.brideNameHe || "";

    }


    if (els.groomName){

      els.groomName.dataset.he =
        data.groomNameHe || "";

      els.groomName.dataset.en =
        data.groomNameEn || "";

      els.groomName.textContent =
        currentLang === "en"
          ? data.groomNameEn || ""
          : data.groomNameHe || "";

    }


    /* ----------------------------------------------------------
       Hero image
       ---------------------------------------------------------- */

    if (
      els.heroImage &&
      data.heroImage
    ){

      els.heroImage.src =
        data.heroImage;


      els.heroImage.dataset.heAlt =
        data.brideNameHe &&
        data.groomNameHe

          ? data.brideNameHe +
            " ו" +
            data.groomNameHe

          : "";


      els.heroImage.dataset.enAlt =
        data.brideNameEn &&
        data.groomNameEn

          ? data.brideNameEn +
            " and " +
            data.groomNameEn

          : "";


      els.heroImage.alt =
        currentLang === "en"
          ? els.heroImage.dataset.enAlt
          : els.heroImage.dataset.heAlt;

    }


    /* ----------------------------------------------------------
       Venue
       ---------------------------------------------------------- */

    if (els.venueName){

      els.venueName.dataset.he =
        data.venueHe || "";

      els.venueName.dataset.en =
        data.venueEn || "";

      els.venueName.textContent =
        currentLang === "en"
          ? data.venueEn || ""
          : data.venueHe || "";

    }


    /* ----------------------------------------------------------
       Event date
       ---------------------------------------------------------- */

    if (els.eventDate){

      els.eventDate.textContent =
        data.date || "";

    }


    /* ----------------------------------------------------------
       Browser title
       ---------------------------------------------------------- */

    document.title =
      "Save the Date | " +

      (
        currentLang === "en"
          ? data.brideNameEn || ""
          : data.brideNameHe || ""
      ) +

      " & " +

      (
        currentLang === "en"
          ? data.groomNameEn || ""
          : data.groomNameHe || ""
      ) +

      " · " +

      (
        data.date || ""
      );


    /* ----------------------------------------------------------
       Wedding date / countdown
       ---------------------------------------------------------- */

    if (data.dateISO){

      WEDDING_DATE =
        new Date(
          data.dateISO
        );

      startCountdown();

    }


    /* ----------------------------------------------------------
       RSVP Google Form
       ---------------------------------------------------------- */

    if (
      els.rsvpIframe &&
      (
        data.rsvpUrlEn ||
        data.rsvpUrlHe
      )
    ){

      els.rsvpIframe.src =
        currentLang === "en"

          ? (
              data.rsvpUrlEn ||
              data.rsvpUrlHe ||
              ""
            )

          : (
              data.rsvpUrlHe ||
              data.rsvpUrlEn ||
              ""
            );

    }


    /* ----------------------------------------------------------
       Apply language
       ---------------------------------------------------------- */

    applyLanguage(
      currentLang
    );

  }


  /* ==========================================================
     COUNTDOWN TIMER
     ========================================================== */

  var previous = {

    days: null,
    hours: null,
    minutes: null,
    seconds: null

  };


  function pad(n){

    return String(n)
      .padStart(2, "0");

  }


  function renderUnit(
    el,
    key,
    value
  ){

    if (!el){
      return;
    }


    var text =
      pad(value);


    if (
      previous[key] !== text
    ){

      el.textContent =
        text;


      el.classList.add(
        "tick"
      );


      window.setTimeout(
        function(){

          el.classList.remove(
            "tick"
          );

        },
        250
      );


      previous[key] =
        text;

    }

  }


  function updateCountdown(){

    if (!WEDDING_DATE){
      return;
    }


    var distance =
      WEDDING_DATE.getTime() -
      new Date().getTime();


    if (distance <= 0){

      renderUnit(
        els.days,
        "days",
        0
      );

      renderUnit(
        els.hours,
        "hours",
        0
      );

      renderUnit(
        els.minutes,
        "minutes",
        0
      );

      renderUnit(
        els.seconds,
        "seconds",
        0
      );


      if (countdownTimer){

        clearInterval(
          countdownTimer
        );

      }


      return;

    }


    renderUnit(
      els.days,
      "days",
      Math.floor(
        distance / 86400000
      )
    );


    renderUnit(
      els.hours,
      "hours",
      Math.floor(
        (
          distance %
          86400000
        ) / 3600000
      )
    );


    renderUnit(
      els.minutes,
      "minutes",
      Math.floor(
        (
          distance %
          3600000
        ) / 60000
      )
    );


    renderUnit(
      els.seconds,
      "seconds",
      Math.floor(
        (
          distance %
          60000
        ) / 1000
      )
    );

  }


  function startCountdown(){

    if (countdownTimer){

      clearInterval(
        countdownTimer
      );

    }


    previous = {

      days: null,
      hours: null,
      minutes: null,
      seconds: null

    };


    updateCountdown();


    countdownTimer =
      window.setInterval(
        updateCountdown,
        1000
      );

  }


  /* ==========================================================
     RSVP MODAL
     ========================================================== */

  var modal =
    document.getElementById(
      "rsvpModal"
    );

  var openBtn =
    document.getElementById(
      "openRsvp"
    );

  var closeBtn =
    document.getElementById(
      "closeRsvp"
    );

  var iframe =
    document.getElementById(
      "rsvpIframe"
    );

  var loader =
    document.getElementById(
      "formLoader"
    );

  var lastFocused =
    null;


  function openModal(){

    lastFocused =
      document.activeElement;


    modal.classList.add(
      "is-open"
    );


    modal.setAttribute(
      "aria-hidden",
      "false"
    );


    document.body.style.overflow =
      "hidden";


    closeBtn.focus();

  }


  function closeModal(){

    modal.classList.remove(
      "is-open"
    );


    modal.setAttribute(
      "aria-hidden",
      "true"
    );


    document.body.style.overflow =
      "";


    if (lastFocused){

      lastFocused.focus();

    }

  }


  if (openBtn){

    openBtn.addEventListener(
      "click",
      openModal
    );

  }


  if (closeBtn){

    closeBtn.addEventListener(
      "click",
      closeModal
    );

  }


  if (modal){

    modal.addEventListener(
      "click",
      function(e){

        if (
          e.target === modal
        ){

          closeModal();

        }

      }
    );

  }


  document.addEventListener(
    "keydown",
    function(e){

      if (

        e.key === "Escape" &&

        modal &&
        modal.classList.contains(
          "is-open"
        )

      ){

        closeModal();

      }

    }
  );


  if (iframe){

    iframe.addEventListener(
      "load",
      function(){

        if (loader){

          loader.style.display =
            "none";

        }

      }
    );

  }


  /* ==========================================================
     LANGUAGE TOGGLE
     ========================================================== */

  var htmlEl =
    document.documentElement;


  var langToggle =
    document.getElementById(
      "langToggle"
    );


  var langToggleLabel =
    document.getElementById(
      "langToggleLabel"
    );


  var translatable =
    document.querySelectorAll(
      "[data-en]"
    );


  function applyLanguage(lang){

    currentLang =
      lang;


    /* ----------------------------------------------------------
       Static translated elements
       ---------------------------------------------------------- */

    translatable.forEach(
      function(el){

        if (
          !el.dataset.he
        ){

          el.dataset.he =
            el.textContent.trim();

        }


        el.textContent =
          lang === "en"
            ? el.dataset.en
            : el.dataset.he;

      }
    );


    /* ----------------------------------------------------------
       Couple names
       ---------------------------------------------------------- */

    if (els.brideName){

      els.brideName.textContent =
        lang === "en"

          ? els.brideName.dataset.en || ""

          : els.brideName.dataset.he || "";

    }


    if (els.groomName){

      els.groomName.textContent =
        lang === "en"

          ? els.groomName.dataset.en || ""

          : els.groomName.dataset.he || "";

    }


    /* ----------------------------------------------------------
       Venue
       ---------------------------------------------------------- */

    if (els.venueName){

      els.venueName.textContent =
        lang === "en"

          ? els.venueName.dataset.en || ""

          : els.venueName.dataset.he || "";

    }


    /* ----------------------------------------------------------
       RSVP Google Form
       ---------------------------------------------------------- */

    if (
      els.rsvpIframe &&
      invitationData &&
      (
        invitationData.rsvpUrlEn ||
        invitationData.rsvpUrlHe
      )
    ){

      els.rsvpIframe.src =

        lang === "en"

          ? (
              invitationData.rsvpUrlEn ||
              invitationData.rsvpUrlHe ||
              ""
            )

          : (
              invitationData.rsvpUrlHe ||
              invitationData.rsvpUrlEn ||
              ""
            );

    }


    /* ----------------------------------------------------------
       Hero image alt
       ---------------------------------------------------------- */

    if (
      els.heroImage
    ){

      els.heroImage.alt =
        lang === "en"

          ? els.heroImage.dataset.enAlt || ""

          : els.heroImage.dataset.heAlt || "";

    }


    /* ----------------------------------------------------------
       Browser title
       ---------------------------------------------------------- */

    if (invitationData){

      document.title =
        "Save the Date | " +

        (
          lang === "en"
            ? invitationData.brideNameEn || ""
            : invitationData.brideNameHe || ""
        ) +

        " & " +

        (
          lang === "en"
            ? invitationData.groomNameEn || ""
            : invitationData.groomNameHe || ""
        ) +

        " · " +

        (
          invitationData.date || ""
        );

    }


    /* ----------------------------------------------------------
       Dynamic social metadata
       ---------------------------------------------------------- */

    updateSocialMetadata();


    /* ----------------------------------------------------------
       HTML direction
       ---------------------------------------------------------- */

    htmlEl.setAttribute(
      "lang",
      lang
    );


    htmlEl.setAttribute(
      "dir",
      lang === "en"
        ? "ltr"
        : "rtl"
    );


    /* ----------------------------------------------------------
       Language toggle label
       ---------------------------------------------------------- */

    if (langToggleLabel){

      langToggleLabel.textContent =
        lang === "en"
          ? "עברית"
          : "English";

    }

  }


  if (langToggle){

    langToggle.addEventListener(
      "click",
      function(){

        applyLanguage(

          currentLang === "he"
            ? "en"
            : "he"

        );

      }
    );

  }


  /* ==========================================================
     ERROR MESSAGE
     ========================================================== */

  function showError(message){

    document.body.innerHTML =

      '<div style="' +
        'min-height:100vh;' +
        'display:flex;' +
        'align-items:center;' +
        'justify-content:center;' +
        'background:#2C3E35;' +
        'color:#fff;' +
        'font-family:Assistant,Arial,sans-serif;' +
        'padding:24px;' +
        'text-align:center;' +
      '">' +

        '<div>' +

          '<h2 style="margin-bottom:10px;">' +
            'Invitation not found' +
          '</h2>' +

          '<p style="opacity:.8;">' +
            message +
          '</p>' +

        '</div>' +

      '</div>';

  }


  /* ==========================================================
     START
     ========================================================== */

  loadInvitation();

})();

</script>
